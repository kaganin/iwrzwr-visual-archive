<div id="iwr-vector-studies" aria-label="Vector Scope için beş yeni ses animasyonu">
  <div class="viz-controls">
    <button type="button" class="btn" data-mode="play" aria-pressed="true">Çalma</button>
    <button type="button" class="btn" data-mode="record" aria-pressed="false">Kayıt</button>
    <button type="button" class="btn btn-ghost" data-pause aria-pressed="false">Duraklat</button>
    <span class="text-small text-muted">Örnek sinyal · sessiz önizleme</span>
  </div>
  <div class="vs-layout">
    <div class="vs-stage">
      <div class="vs-phone" aria-label="iwrzwr vektör animasyonları önizlemesi">
        <div class="vs-header">
          <div class="vs-status" aria-hidden="true"><span>9:41</span><span>••• &nbsp; ▰</span></div>
          <div class="vs-controls">
            <div class="vs-circle" aria-hidden="true"></div>
            <div class="vs-activity">
              <div class="vs-record" hidden><span class="vs-dot"></span><span data-clock>00:00</span></div>
              <canvas role="img" aria-label="XY Dust: hareketli faz noktaları"></canvas>
            </div>
            <div class="vs-circle" aria-hidden="true"></div>
          </div>
        </div>
        <div class="vs-pads" aria-hidden="true"><div><i data-lucide="mic"></i></div><div><i data-lucide="mic"></i></div></div>
      </div>
      <div class="text-small text-muted vs-spec">44px alan · 24px boşluk · merkez hizalı</div>
    </div>
    <div class="vs-options" role="group" aria-label="Beş yeni alternatif">
      <button type="button" class="btn btn-block" data-style="sweep" aria-pressed="false">1 · Phosphor Sweep</button>
      <button type="button" class="btn btn-block" data-style="dust" aria-pressed="true">2 · XY Dust</button>
      <button type="button" class="btn btn-block" data-style="braid" aria-pressed="false">3 · Phase Braid</button>
      <button type="button" class="btn btn-block" data-style="terminal" aria-pressed="false">4 · Terminal Trace</button>
      <button type="button" class="btn btn-block" data-style="contour" aria-pressed="false">5 · Contour Memory</button>
    </div>
  </div>
  <div class="vs-caption" data-description aria-live="polite">Çizgi yerine yüzlerce küçük nokta; sesle sıkışıp açılan bir faz bulutu.</div>
</div>
<style>
  #iwr-vector-studies .vs-layout { display:grid; grid-template-columns:minmax(0,402px) minmax(150px,1fr); gap:24px; align-items:center; margin-top:20px; }
  #iwr-vector-studies .vs-stage { min-width:0; }
  #iwr-vector-studies .vs-options { display:grid; gap:8px; }
  #iwr-vector-studies .vs-phone { width:100%; background:#cdcdcd; color:#fff; font-family:-apple-system,BlinkMacSystemFont,sans-serif; border-radius:30px; overflow:hidden; }
  #iwr-vector-studies .vs-header { height:126px; position:relative; background:#000; border-radius:0 0 32px 40px; }
  #iwr-vector-studies .vs-status { position:absolute; top:24px; left:28px; right:28px; display:flex; justify-content:space-between; font-size:13px; line-height:16px; font-weight:500; }
  #iwr-vector-studies .vs-controls { position:absolute; top:62px; left:20px; right:20px; display:flex; align-items:center; gap:24px; height:44px; }
  #iwr-vector-studies .vs-circle { flex:none; width:44px; height:44px; border-radius:50%; background:#141414; box-shadow:inset 0 0 0 1px #303030; }
  #iwr-vector-studies .vs-activity { display:flex; flex:1; min-width:0; height:44px; gap:8px; align-items:center; }
  #iwr-vector-studies canvas { display:block; flex:1; min-width:0; width:100%; height:44px; }
  #iwr-vector-studies .vs-record { display:flex; flex:none; width:60px; align-items:center; gap:6px; color:#fff; font-family:ui-monospace,monospace; font-size:11px; line-height:14px; font-variant-numeric:tabular-nums; }
  #iwr-vector-studies .vs-record[hidden] { display:none; }
  #iwr-vector-studies .vs-dot { width:6px; height:6px; border-radius:50%; flex:none; background:#ff413a; }
  #iwr-vector-studies .vs-pads { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:#b4b4b4; }
  #iwr-vector-studies .vs-pads>div { display:grid; place-items:center; height:120px; background:#cdcdcd; color:#909090; }
  #iwr-vector-studies .vs-pads svg { width:18px; height:18px; }
  #iwr-vector-studies .vs-spec { margin-top:10px; }
  #iwr-vector-studies .vs-caption { margin-top:18px; min-height:44px; }
  @media(max-width:610px) { #iwr-vector-studies .vs-layout { grid-template-columns:minmax(0,1fr); gap:18px; } #iwr-vector-studies .vs-stage { width:100%; max-width:402px; margin:auto; } #iwr-vector-studies .vs-options { grid-template-columns:repeat(2,minmax(0,1fr)); } }
</style>
<script>
(() => {
  const root=document.getElementById('iwr-vector-studies');
  const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d');
  const badge=root.querySelector('.vs-record'),clock=root.querySelector('[data-clock]');
  const caption=root.querySelector('[data-description]'),pause=root.querySelector('[data-pause]');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const state={style:'dust',mode:'play',paused:false,tone:'white',gain:0.8};
  const descriptions={
    sweep:'Parlak bir tarama ucu dalgayı yazıyor; önceki iz fosfor gibi yavaşça sönüyor.',
    dust:'Çizgi yerine yüzlerce küçük nokta; sesle sıkışıp açılan bir faz bulutu.',
    braid:'Karşılıklı iki sinyal, ince bağlarla dönen bir örgü oluşturuyor; dijital bir çift sarmal.',
    terminal:'┌ ┐ └ ┘ ─ │ karakterleriyle çizilen basamaklı dalga; eski terminal ekranı hissi.',
    contour:'Eski dalgalar arkaya çekilen katmanlar halinde kalıyor; sinyalin topografik hafızası.'
  };
  const names={sweep:'Phosphor Sweep',dust:'XY Dust',braid:'Phase Braid',terminal:'Terminal Trace',contour:'Contour Memory'};
  const colors={white:'#f1f1ee',green:'#a0f0b0',amber:'#ffc66c'};
  let w=226,h=44,elapsed=2.35,last=0,level=0.55,recordTime=0,dpr=2;
  // Live sound seam: iwrSignal exists only inside the archive gallery. Without it, or with sound off, nothing changes.
  const live=()=>typeof iwrSignal!=='undefined'&&iwrSignal.active?iwrSignal:null;
  const heard=(s,time)=>{const age=Math.max(0,elapsed-time);return 0.13+0.87*Math.max(s.levelAt(age),s.hitAt(age));};
  const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
  const mod=(a,b)=>((a%b)+b)%b;
  function amplitude(t){const s=live();if(s)return heard(s,t);return 0.16+0.52*Math.pow(Math.sin(t*1.65),4)+0.26*Math.pow(Math.sin(t*3.15+0.7),8);}
  function wave(t){return Math.sin(t*12)*0.60+Math.sin(t*21.5+0.8)*0.25+Math.sin(t*32.6)*0.15;}
  function ink(alpha){ctx.strokeStyle=colors[state.tone];ctx.fillStyle=colors[state.tone];ctx.globalAlpha=clamp(alpha);}
  function line(points,alpha=1,width=1){
    if(!points.length)return;
    ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ink(alpha);ctx.lineWidth=width;ctx.lineCap='butt';ctx.lineJoin='miter';ctx.stroke();ctx.globalAlpha=1;
  }
  function dot(x,y,size,alpha){ink(alpha);ctx.fillRect(Math.round(x*dpr)/dpr,Math.round(y*dpr)/dpr,size,size);ctx.globalAlpha=1;}
  function sweep(time,gain){
    line([[1,22],[w-1,22]],0.11,0.65);
    for(let x=10;x<w;x+=14)line([[x,20.5],[x,23.5]],0.22,0.65);
    const duration=state.mode==='record'?2.8:2.2;
    const head=mod(time/duration,1),span=w-4;
    const n=Math.max(80,Math.floor(w*1.5));
    function point(u){
      const age=mod(head-u,1)*duration;
      const sampled=time-age;
      const a=amplitude(sampled)*state.gain/0.8;
      return {age,x:2+u*span,y:22+wave(sampled)*Math.min(18,3+a*16)};
    }
    for(let i=0;i<n;i++){
      const a=point(i/n),b=point((i+1)/n);
      if(Math.abs(a.age-b.age)>duration/2)continue;
      line([[a.x,a.y],[b.x,b.y]],0.12+0.80*Math.exp(-a.age/0.65),1);
    }
    const tip=point(head);
    dot(tip.x-1,tip.y-1,2,0.95);
  }
  function dust(time,gain){
    const phase=time*(state.mode==='record'?0.32:0.23);
    const sx=(w/2-3)*(0.50+gain*0.44),sy=6+gain*13;
    line([[w/2-2,22],[w/2+2,22]],0.22,0.7);
    line([[w/2,20],[w/2,24]],0.22,0.7);
    for(let i=0;i<880;i++){
      const q=i*2.39996323;
      const radius=0.52+0.48*((i*37%101)/100);
      const a=Math.sin(q*2+phase)*radius;
      const b=(Math.sin(q*3+phase*1.8)*0.78+Math.sin(q*7-phase)*0.22)*radius;
      const twist=Math.sin(phase)*0.22;
      const x=w/2+sx*(a*Math.cos(twist)-b*Math.sin(twist))*0.83;
      const y=22+sy*(a*Math.sin(twist)+b*Math.cos(twist))*0.83;
      const bright=0.22+0.55*(0.5+0.5*Math.cos(q*0.6+time*1.4));
      dot(x,y,i%13===0?1:0.65,bright);
    }
  }
  function braidPoint(u,time,gain,side){
    const a=u*Math.PI*4-time*(state.mode==='record'?1.4:1);
    const taper=0.38+0.62*Math.pow(Math.sin(Math.PI*u),0.65);
    const radius=(4+gain*13)*taper;
    return [2+u*(w-4),22+Math.sin(a+side*Math.PI)*radius,Math.cos(a+side*Math.PI)];
  }
  function braid(time,gain){
    const n=40;
    for(let i=0;i<=n;i++){
      const a=braidPoint(i/n,time,gain,0),b=braidPoint(i/n,time,gain,1);
      line([a,b],0.13+0.22*Math.abs(a[2]),0.65);
    }
    for(let side=0;side<2;side++)for(let i=0;i<150;i++){
      const a=braidPoint(i/150,time,gain,side),b=braidPoint((i+1)/150,time,gain,side);
      line([a,b],0.28+0.68*(a[2]+1)/2,1);
    }
  }
  function terminal(time,gain){
    const cellWidth=7.22,n=Math.max(5,Math.floor(w/cellWidth));
    const left=(w-n*cellWidth)/2;
    const tick=Math.floor(time*8)/8;
    const columns=Array.from({length:n+1},(_,i)=>{
      const x=i/n,stamp=tick-(1-x)*(state.mode==='record'?3:1.9);
      const value=wave(stamp)*(0.3+amplitude(stamp)*state.gain/0.8);
      return value>0.19?0:value< -0.19?2:1;
    });
    const grid=Array.from({length:3},()=>Array(n).fill(' '));
    for(let c=0;c<n;c++){
      const y=columns[c],next=columns[c+1];
      if(y===next){grid[y][c]='─';continue;}
      grid[y][c]=next>y?'┐':'┘';
      grid[next][c]=next>y?'└':'┌';
      for(let row=Math.min(y,next)+1;row<Math.max(y,next);row++)grid[row][c]='│';
    }
    ctx.font='12px SFMono-Regular, Menlo, monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    for(let r=0;r<3;r++)for(let c=0;c<n;c++){
      const progress=c/Math.max(1,n-1);
      ink(0.34+progress*0.6);
      ctx.fillText(grid[r][c],left+(c+0.5)*cellWidth,8+r*12);
    }
    ctx.globalAlpha=1;
  }
  function contourPoint(u,z,time,gain,heardLevel){
    const stamp=time-(7-z)*0.32;
    const taper=Math.pow(Math.sin(Math.PI*u),1.8);
    const base=11+z*3.9;
    const ridge=Math.abs(wave(u*0.65-stamp*0.35))*taper;
    const height=(4+11*(heardLevel??amplitude(stamp))*state.gain/0.8)*(0.6+z*0.06);
    const span=(w-4)*(0.61+z*0.055);
    return [w/2+(u-0.5)*span,base-ridge*Math.min(height,base-2)];
  }
  function contour(time,gain){
    const timeScale=state.mode==='record'?1:0.72;
    for(let z=0;z<8;z++){
      const s=live(),age=(7-z)*.32,heardLevel=s? .13+.87*Math.max(s.levelAt(age),s.hitAt(age)):undefined;
      const points=[];
      for(let i=0;i<=105;i++)points.push(contourPoint(i/105,z,time*timeScale,gain,heardLevel));
      ctx.beginPath();ctx.moveTo(points[0][0],43);
      points.forEach(p=>ctx.lineTo(p[0],p[1]));ctx.lineTo(points[points.length-1][0],43);ctx.closePath();
      ctx.globalAlpha=1;ctx.fillStyle='#000';ctx.fill();
      line(points,0.18+z*0.11,z===7?1:0.7);
    }
  }
  const renderers={sweep,dust,braid,terminal,contour};
  function draw(){
    ctx.clearRect(0,0,w,h);
    const time=reduced.matches?2.35:elapsed;
    const gain=reduced.matches?0.44+level*0.12:level;
    renderers[state.style](time,gain);
  }
  function resize(){
    w=Math.max(1,canvas.getBoundingClientRect().width);dpr=Math.min(devicePixelRatio||1,3);
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();
  }
  function sync(){
    root.querySelectorAll('[data-style]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.style===state.style)));
    root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));
    badge.hidden=state.mode!=='record';
    pause.textContent=state.paused?'Devam et':'Duraklat';pause.setAttribute('aria-pressed',String(state.paused));
    caption.textContent=descriptions[state.style];canvas.setAttribute('aria-label',names[state.style]+': '+descriptions[state.style]);resize();
  }
  root.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>{state.style=b.dataset.style;sync();}));
  root.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.mode;recordTime=0;sync();}));
  pause.addEventListener('click',()=>{state.paused=!state.paused;sync();});
  let visible=true;
  const visibility=new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;});visibility.observe(root);
  const observer=new ResizeObserver(resize);observer.observe(canvas);
  function frame(now){
    if(!root.isConnected){visibility.disconnect();observer.disconnect();return;}
    const dt=last?Math.min((now-last)/1000,0.05):0;last=now;
    if(!state.paused&&!document.hidden&&visible){
      elapsed+=dt;recordTime+=dt;
      const target=clamp(amplitude(elapsed)*state.gain/0.8);
      level+=(target-level)*(1-Math.exp(-dt/(target>level?0.08:0.24)));
      draw();
      const n=Math.floor(recordTime*100)%6000;clock.textContent=String(Math.floor(n/100)).padStart(2,'0')+':'+String(n%100).padStart(2,'0');
    }
    requestAnimationFrame(frame);
  }
  sync();requestAnimationFrame(frame);
  if(globalThis.Tweak){
    const tweaks=new Tweak({container:root.querySelector('.vs-phone'),onChange:sync});
    tweaks.addSelect(state,'tone',{label:'Fosfor rengi',options:[{label:'Beyaz',value:'white'},{label:'Yeşil',value:'green'},{label:'Amber',value:'amber'}]});
    tweaks.addSlider(state,'gain',{label:'Sinyal yoğunluğu',min:0.2,max:1,step:0.05});
  }
})();
</script>
