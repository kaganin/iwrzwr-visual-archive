<div id="tape-two" aria-label="Five more circular voice recording concepts">
<div class="controls"><button type="button">Pause</button><span>Simulated voice · silent demo</span></div><div class="studies"></div>
</div>
<style>
#tape-two{font-family:system-ui,sans-serif;color:light-dark(#222,#eee)}
#tape-two .controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
#tape-two button{font:inherit;color:inherit;background:transparent;border:1px solid light-dark(#aaa,#555);border-radius:8px;padding:10px 18px;cursor:pointer;min-height:44px}
#tape-two .studies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}
#tape-two figure{margin:0;text-align:center;min-width:0}
#tape-two canvas{display:block;width:100%;max-width:204px;aspect-ratio:1;margin:auto;border-radius:50%;background:#000;border:1px solid #ffffff29;box-sizing:border-box}
#tape-two figcaption{margin-top:12px}#tape-two small{display:block;margin-top:5px;color:light-dark(#555,#aaa)}
@media(max-width:520px){#tape-two .studies{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<script>
(()=>{
const root=document.getElementById('tape-two'),grid=root.querySelector('.studies'),button=root.querySelector('button');
const names=['Radial Take','Folded Tape','Spool Memory','Grain Shutter','Contour Stack'];
const notes=['Voice etched around a rotating head','One take folds into two lanes','The waveform winds onto a reel','Slices open around a fixed head','Recent phrases recede into depth'];
const contexts=names.map((n,i)=>{const f=document.createElement('figure'),c=document.createElement('canvas'),title=document.createElement('figcaption'),sub=document.createElement('small');c.width=c.height=480;c.setAttribute('role','img');c.setAttribute('aria-label',n+'. '+notes[i]);title.textContent=String(i+6).padStart(2,'0')+' · '+n;sub.textContent=notes[i];f.append(c,title,sub);grid.append(f);return c.getContext('2d')});
const state={playing:!matchMedia('(prefers-reduced-motion: reduce)').matches,speed:1,amplitude:1};let t=3,last=0;
const TAU=Math.PI*2,W='#eeeee8',G='#666662',R='#ff3b30';
function amp(s){return 1+state.amplitude*27*(.3+.7*(.5+.5*Math.sin(s*1.6)))*(.65*Math.max(0,Math.sin(s*5.2))**2+.35*Math.max(0,Math.sin(s*11.3+.8))**4)}
function line(g,x,y,a,b,c=G){g.beginPath();g.strokeStyle=c;g.lineWidth=1;g.moveTo(x,y);g.lineTo(a,b);g.stroke()}
function head(g,x,y,h,c=R){line(g,x,y-h,x,y+h,c);g.fillStyle=c;g.fillRect(x-4,y-h,8,2);g.fillRect(x-4,y+h-2,8,2)}
function wave(g,l,r,y,fn,scale=1,color=W){g.beginPath();for(let x=l;x<=r;x+=.7)g.lineTo(x,y-amp(fn(x))*scale);for(let x=r;x>=l;x-=.7)g.lineTo(x,y+amp(fn(x))*scale);g.closePath();g.fillStyle=color;g.fill()}
function polar(radius,a){return [120+radius*Math.cos(a),120+radius*Math.sin(a)]}
function draw(){contexts.forEach((g,i)=>{g.setTransform(2,0,0,2,0,0);g.clearRect(0,0,240,240);g.save();g.beginPath();g.arc(120,120,119,0,TAU);g.clip();
if(i===0){const a=t*.55-Math.PI/2;g.strokeStyle='#343432';g.beginPath();g.arc(120,120,68,0,TAU);g.stroke();g.beginPath();for(let j=0;j<=320;j++){const age=j/320*9.8,angle=a-j/320*(TAU-.12),p=polar(68+amp(t-age)*.65,angle);g.lineTo(...p)}for(let j=320;j>=0;j--){const age=j/320*9.8,angle=a-j/320*(TAU-.12),p=polar(68-amp(t-age)*.65,angle);g.lineTo(...p)}g.closePath();g.fillStyle=W;g.fill();line(g,...polar(40,a),...polar(96,a),R);g.fillStyle=R;const p=polar(96,a);g.fillRect(p[0]-2,p[1]-2,4,4)}
if(i===1){line(g,30,90,190,90);line(g,30,150,190,150);g.beginPath();g.strokeStyle=G;g.arc(190,120,30,-Math.PI/2,Math.PI/2);g.stroke();wave(g,30,190,90,x=>t-(190-x)/30,.72);wave(g,30,190,150,x=>t-1.8-(x-30)/30,.72,'#93938d');head(g,75,90,29);line(g,75,120,75,178,R);g.fillStyle=R;g.fillRect(71,176,8,2)}
if(i===2){const end=t*.55;for(let turn=0;turn<3;turn++){g.beginPath();for(let j=0;j<=240;j++){const u=j/240,a=end-u*TAU,r=29+turn*21+u*18+amp(t-u*5-turn*5)*.22,p=polar(r,a);g.lineTo(...p)}for(let j=240;j>=0;j--){const u=j/240,a=end-u*TAU,r=29+turn*21+u*18-amp(t-u*5-turn*5)*.22,p=polar(r,a);g.lineTo(...p)}g.closePath();g.fillStyle=turn===2?W:turn===1?'#92928d':'#4e4e4a';g.fill()}line(g,...polar(64,end),...polar(92,end),R);g.beginPath();g.arc(120,120,5,0,TAU);g.strokeStyle=G;g.stroke()}
if(i===3){line(g,26,120,214,120);for(let n=0;n<24;n++){const x=26+n*8,age=(154-x)/28;g.save();g.beginPath();g.rect(x,66,5.5,108);g.clip();wave(g,x,x+5.5,120,q=>t-(154-q)/28,1,x>154?'#4e4e4a':W);g.restore()}g.fillStyle='#ffffff0d';g.fillRect(136,67,36,106);head(g,154,120,53)}
if(i===4){for(let n=4;n>=0;n--){const u=(t*.22)%1,depth=(n+u)/5,y=151-depth*64,l=27+depth*30,r=213-depth*30;line(g,l,y,r,y,'#353533');wave(g,l,r,y,x=>t-n*.42-(r-x)/29,(1-depth*.65)*.8,n===0?W:n===1?'#a4a49e':n===2?'#73736e':'#454541')}head(g,171,139,39);}
g.restore()})}
function sync(){button.textContent=state.playing?'Pause':'Play';draw()}
button.onclick=()=>{state.playing=!state.playing;sync()};
function frame(now){if(last&&state.playing&&!document.hidden)t+=Math.min(.05,(now-last)/1000)*state.speed;last=now;draw();requestAnimationFrame(frame)}
sync();requestAnimationFrame(frame);
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:sync});tweak.addSlider(state,'speed',{label:'Travel speed',min:.4,max:1.5,step:.1});tweak.addSlider(state,'amplitude',{label:'Voice intensity',min:.3,max:1.5,step:.1})}
})();
</script>
