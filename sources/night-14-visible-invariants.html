<div id="iwr-night-invariants" aria-label="Set 14: Visible Invariants, beş hareketli ses ekranı">

    <button type="button" class="btn" data-mode="play" aria-pressed="true">Çalma</button>
    <button type="button" class="btn" data-mode="record" aria-pressed="false">Kayıt</button>
    <button type="button" class="btn btn-ghost" data-pause aria-pressed="false">Duraklat</button>
    <span class="text-small text-muted">Örnek ses ritmi · sessiz demo</span>
  </div>
  <div class="vi-layout">
    <div class="vi-stage">
      <div class="vi-phone" aria-label="iwrzwr: Visible Invariants önizlemesi">
        <div class="vi-header">
          <div class="vi-status" aria-hidden="true"><span>9:41</span><span data-record hidden>REC</span><span>••• &nbsp; ▰</span></div>
          <div class="vi-controls">
            <div class="vi-circle" aria-hidden="true"></div>
            <canvas role="img" aria-label="Moment Balance: yüklerden hesaplanan denge noktası"></canvas>
            <div class="vi-circle" aria-hidden="true"><i data-lucide="plus"></i></div>
          </div>
        </div>
        <div class="vi-pads" aria-hidden="true"><div><i data-lucide="mic"></i></div><div><i data-lucide="mic"></i></div></div>
      </div>
      <div class="text-small text-muted vi-spec">126px header · 44px alan · 24px boşluk</div>
    </div>
    <div class="vi-options" role="group" aria-label="Visible Invariants seçenekleri">
      <button type="button" class="btn btn-block" data-style="moment" aria-pressed="true">1 · Moment Balance</button>
      <button type="button" class="btn btn-block" data-style="marginal" aria-pressed="false">2 · Marginal Print</button>
      <button type="button" class="btn btn-block" data-style="area" aria-pressed="false">3 · Area Contract</button>
      <button type="button" class="btn btn-block" data-style="registration" aria-pressed="false">4 · Registration Residual</button>
      <button type="button" class="btn btn-block" data-style="occlusion" aria-pressed="false">5 · Occlusion Order</button>
    </div>
  </div>
  <div class="vi-caption" data-description aria-live="polite">Destek, beş yükün gerçek ağırlık merkezinde; yüksek ses her zaman sağa gitmiyor.</div>
</div>
<style>
  #iwr-night-invariants .vi-layout { display:grid; grid-template-columns:minmax(0,402px) minmax(190px,1fr); gap:24px; align-items:center; margin-top:20px; }
  #iwr-night-invariants .vi-stage { min-width:0; }
  #iwr-night-invariants .vi-options { display:grid; gap:8px; }
  #iwr-night-invariants .vi-phone { --vi-screen:#000; --vi-pad:#cdcdcd; --vi-divider:#b6b6b6; --vi-ink:#f1f0e8; color:var(--vi-ink); background:var(--vi-pad); border-radius:30px; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
  #iwr-night-invariants .vi-header { height:126px; position:relative; background:var(--vi-screen); border-radius:0 0 32px 40px; }
  #iwr-night-invariants .vi-status { position:absolute; top:24px; left:28px; right:28px; display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:500; }
  #iwr-night-invariants [data-record] { color:#ff8141; font-family:ui-monospace,monospace; font-size:11px; }
  #iwr-night-invariants [hidden] { display:none; }
  #iwr-night-invariants .vi-controls { position:absolute; top:62px; left:20px; right:20px; display:flex; align-items:center; gap:24px; height:44px; }
  #iwr-night-invariants .vi-circle { width:44px; height:44px; flex:none; display:grid; place-items:center; border-radius:50%; background:#141414; box-shadow:inset 0 0 0 1px #303030; }
  #iwr-night-invariants .vi-circle svg { width:20px; height:20px; stroke-width:1.5; }
  #iwr-night-invariants canvas { display:block; height:44px; width:100%; flex:1; min-width:0; }
  #iwr-night-invariants .vi-pads { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--vi-divider); }
  #iwr-night-invariants .vi-pads>div { display:grid; place-items:center; height:120px; background:var(--vi-pad); color:#929292; }
  #iwr-night-invariants .vi-pads svg { width:18px; height:18px; }
  #iwr-night-invariants .vi-spec { margin-top:10px; }
  #iwr-night-invariants .vi-caption { margin-top:16px; min-height:44px; }
  @media(max-width:630px) { #iwr-night-invariants .vi-layout { grid-template-columns:minmax(0,1fr); gap:18px; } #iwr-night-invariants .vi-stage { width:100%; max-width:402px; margin:auto; } }
</style>
<script>
(() => {
  const root=document.getElementById('iwr-night-invariants');
  const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d');
  const pause=root.querySelector('[data-pause]'),caption=root.querySelector('[data-description]');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const state={style:'moment',mode:'play',paused:reduced.matches,accent:true};
  const names={moment:'Moment Balance',marginal:'Marginal Print',area:'Area Contract',registration:'Registration Residual',occlusion:'Occlusion Order'};
  const descriptions={
    moment:['Destek, beş yükün gerçek ağırlık merkezinde; yüksek ses her zaman sağa gitmiyor.','Her darbe yalnız bir yükü değiştiriyor; kısa kol, destek dengeye gelince kayboluyor.'],
    marginal:['Tek kolon okunurken harita ve iki kenardaki gerçek toplamlar değişmiyor.','Bir adres yazılınca hem o satırın hem o kolonun toplamı birlikte artıyor.'],
    area:['Üç pay yer değiştiriyor; dış üçgenin alanı hiç değişmiyor.','Önce iki pay yazılıyor; üçüncü, kalan alanı alıyor.'],
    registration:['Ortak kayma çıkarılıyor; tek yerel sapma ve dört küçük ters düzeltme kalıyor.','Beş ölçüm toplanıp hizalanıyor; yalnız yerel farkların bağlantıları kalıyor.'],
    occlusion:['Ön şekil sabit; arkadaki geçerken yalnız örtülen kenar parçaları kayboluyor.','Geometri sabit; her darbe hangi şeklin önde kaldığını yazıyor.']
  };
  const white='#f1f0e8',amber='#ff963e';
  let w=226,dpr=1,t=2.4,last=0,raf=0,visible=true;
  const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),mod=(x,n)=>(x%n+n)%n,mix=(a,b,q)=>a+(b-a)*q;
  const accent=()=>state.accent?amber:white;
  function ink(alpha=1,color=white) { ctx.globalAlpha=clamp(alpha);ctx.fillStyle=color;ctx.strokeStyle=color; }
  function rect(x,y,width,height,alpha=1,color=white) { ink(alpha,color);ctx.fillRect(Math.round(x*dpr)/dpr,Math.round(y*dpr)/dpr,width,height); }
  function line(points,alpha=1,color=white) { if(points.length<2)return;ink(alpha,color);ctx.lineWidth=1;ctx.lineCap='butt';ctx.lineJoin='miter';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke(); }
  // All inputs are deterministic synthetic examples, never microphone measurements.
  const loadPositions=[.12,.31,.5,.69,.88];
  const savedLoads=[[.8,.45,.65,.45,.8],[.04,.08,.12,.16,.3],[.85,.3,.1,.15,.06],[0,0,0,0,0],[.14,.3,.8,.3,.14],[.3,.16,.12,.08,.04]];
  const loadEdits=[[0,.1],[4,.15],[2,.1],[1,.1],[3,.25],[0,.8],[4,.8],[2,.65],[1,.45],[3,.45]];
  const recordedLoads=[];let loadSeed=[...savedLoads[0]];
  for(const [index,value] of loadEdits){loadSeed=[...loadSeed];loadSeed[index]=value;recordedLoads.push(loadSeed);}
  function balance(weights,held=.5) {
    const total=weights.reduce((a,b)=>a+b,0),weighted=weights.reduce((sum,value,index)=>sum+value*loadPositions[index],0);
    return {total,position:total>1e-10?weighted/total:held};
  }
  function momentModel(time,recording) {
    if(recording) {
      const clock=mod(time,8),index=Math.floor(clock/.8),phase=clock-index*.8,weights=recordedLoads[index],previous=recordedLoads[mod(index-1,10)],target=balance(weights),old=balance(previous).position;
      const support=mix(old,target.position,clamp(phase/.4));
      return {weights,index:loadEdits[index][0],target:target.position,support,old,total:target.total,moment:weights.reduce((sum,value,i)=>sum+value*(loadPositions[i]-support),0),moving:phase<.4};
    }
    const clock=mod(time,9.6),index=Math.min(5,Math.floor(clock/1.6)),phase=clock-index*1.6,previous=savedLoads[mod(index-1,6)],weights=previous.map((value,i)=>mix(value,savedLoads[index][i],clamp(phase/.7)));
    let held=.5;for(let ago=1;ago<=6;ago++){const candidate=balance(savedLoads[mod(index-ago,6)]);if(candidate.total>0){held=candidate.position;break;}}
    const target=balance(weights,held);return {weights,index:-1,target:target.position,support:target.position,old:target.position,total:target.total,moment:0,moving:false};
  }
  function moment(time) {
    const m=momentModel(time,state.mode==='record'),x=value=>5+value*(w-10);
    line([[x(.06),22],[x(.94),22]],m.total?.88:.35);
    m.weights.forEach((value,index)=>{const at=x(loadPositions[index]);if(value>0){line([[at,22-14*value],[at,22]],.96,index===m.index?accent():white);line([[at-2,20],[at,22],[at+2,20]],.65);}else line([[at-1,22],[at+1,22]],.25);});
    const at=x(m.support);line([[at-4,33],[at,25],[at+4,33],[at-4,33]],m.total?1:.4,accent());
    if(m.moving&&Math.abs(m.target-m.support)>1e-6){line([[x(m.old),37],[x(m.old),40]],.35);line([[at,36],[x(m.target),36]],.8,accent());line([[x(m.target),34],[x(m.target),38]],.8,accent());}
  }
  const addresses=[[0,0],[1,2],[2,4],[0,4],[2,0],[1,5],[0,2],[2,5]];
  function marginals(points) {
    const rows=[0,0,0],columns=[0,0,0,0,0,0,0];
    points.forEach(([row,column])=>{rows[row]++;columns[column]++;});return {rows,columns};
  }
  function marginalModel(time,recording) {
    const count=recording?clamp(Math.floor(mod(time,6.6)/.55),0,8):8,points=addresses.slice(0,count),totals=marginals(points),column=recording?-1:Math.floor(mod(time,5.6)/.7);
    return {points,totals,column,latest:recording&&count>0&&mod(time,6.6)<4.95?count-1:-1};
  }
  function marginal(time) {
    const m=marginalModel(time,state.mode==='record'),x=column=>10+column*(w-55)/6,y=row=>8+row*8;
    for(let row=0;row<3;row++)for(let col=0;col<7;col++)rect(x(col)-.5,y(row)-.5,1,1,.24);
    m.points.forEach(([row,col],index)=>line([[x(col)-2,y(row)],[x(col)+2,y(row)]],.96,col===m.column||index===m.latest?accent():white));
    m.totals.rows.forEach((total,row)=>{
      if(total)line([[w-29,y(row)],[w-29+total*5,y(row)]],.75);
      const contribution=m.points.some(([r,c])=>r===row&&c===m.column);
      if(contribution)line([[w-29+(total-1)*5,y(row)],[w-29+total*5,y(row)]],1,accent());
      if(m.latest>=0&&m.points[m.latest][0]===row)line([[w-29+(total-1)*5,y(row)],[w-29+total*5,y(row)]],1,accent());
    });
    m.totals.columns.forEach((total,col)=>{line([[x(col)-1,40],[x(col)+1,40]],.24);if(total)line([[x(col),40],[x(col),40-total*3]],.8,col===m.column||m.latest>=0&&m.points[m.latest][1]===col?accent():white);});
    if(m.column<7&&m.column>=0)line([[x(m.column)-3,3],[x(m.column)+3,3]],.8,accent());
  }
  const mixtures=[[1,1,1],[6,65,29],[55,10,35],[17,28,55]].map(values=>normalize(values));
  function normalize(values,held=[1/3,1/3,1/3]) { const positive=values.map(value=>Math.max(0,value)),total=positive.reduce((a,b)=>a+b,0);return total>1e-10?positive.map(value=>value/total):[...held]; }
  function barycentric(vertices,shares) { return [0,1].map(axis=>vertices.reduce((sum,vertex,index)=>sum+vertex[axis]*shares[index],0)); }
  function areaModel(time,recording) {
    const period=recording?2.4:1.5,clock=mod(time,period*4),index=Math.min(3,Math.floor(clock/period)),phase=clock-index*period,target=mixtures[index],previous=mixtures[mod(index-1,4)];
    if(!recording)return {shares:previous.map((value,i)=>mix(value,target[i],clamp(phase/.75))),active:-1};
    const first=target[0],rest=1-first,ratio=previous[1]/(previous[1]+previous[2]),firstStage=[first,rest*ratio,rest*(1-ratio)];
    if(phase<.8)return {shares:previous.map((value,i)=>mix(value,firstStage[i],clamp(phase/.3))),active:0};
    if(phase<1.6){const second=mix(firstStage[1],target[1],clamp((phase-.8)/.3));return {shares:[first,second,1-first-second],active:1};}
    return {shares:[...target],active:2};
  }
  function area(time) {
    const m=areaModel(time,state.mode==='record'),span=Math.min(150,w-12),left=(w-span)/2,vertices=[[left,35],[left+span,35],[left+span*.38,5]],point=barycentric(vertices,m.shares);
    line([...vertices,vertices[0]],.72);
    vertices.forEach((vertex,index)=>line([vertex,point],.94,m.active>=0&&index!==m.active?accent():white));
    rect(point[0]-1,point[1]-1,2,2,1,accent());
  }
  const referenceMarks=[[.12,18],[.3,25],[.48,16],[.67,28],[.85,20]];
  function register(displacements) {
    if(!displacements.length)return {mean:[0,0],residuals:[]};
    const mean=[0,1].map(axis=>displacements.reduce((sum,point)=>sum+point[axis],0)/displacements.length);
    return {mean,residuals:displacements.map(point=>point.map((value,axis)=>value-mean[axis]))};
  }
  function registrationModel(time,recording) {
    if(recording) {
      const clock=mod(time,4),cycle=Math.floor(time/4),count=clamp(Math.floor(clock/.36)+1,0,5),align=clamp((clock-1.8)/.65),local=mod(cycle,2)?9:0;
      const displacements=referenceMarks.slice(0,count).map((_,i)=>[6,-2+(i===2?local:0)]),estimate=register(displacements);
      return {displacements,...estimate,align,count,shown:displacements.map(point=>point.map((value,axis)=>value-align*estimate.mean[axis]))};
    }
    const clock=mod(time,8),common=[6+3*Math.sin(clock*Math.PI/4),2*Math.sin(clock*Math.PI/4)],deviation=-10*Math.min(clamp((clock-2)/.5),clamp((5-clock)/.5));
    const displacements=referenceMarks.map((_,i)=>[common[0],common[1]+(i===2?deviation:0)]),estimate=register(displacements);
    return {displacements,...estimate,align:1,count:5,shown:estimate.residuals};
  }
  function registration(time) {
    const m=registrationModel(time,state.mode==='record');
    referenceMarks.forEach(([u,y],i)=>{
      const x=5+u*(w-10);line([[x-3,y+3],[x-3,y],[x,y]],.5);
      if(i<m.count){const delta=m.shown[i],point=[x+delta[0],y+delta[1]],length=Math.hypot(...delta),strong=i===2&&Math.hypot(...m.residuals[i])>3;
        if(length>1e-8)line([[x,y],point],.83,strong?accent():white);
        line([[point[0]-1.5,point[1]],[point[0]+1.5,point[1]]],.95,strong?accent():white);
      }
    });
    if(m.align>0){const origin=[w/2,6],tip=[origin[0]+m.mean[0]*m.align,origin[1]+m.mean[1]*m.align];line([[origin[0]-2,origin[1]+2],origin,[origin[0]+2,origin[1]]],.3);line([origin,tip],.65);line([[tip[0],tip[1]-2],tip,[tip[0]+2,tip[1]]],.95,accent());}
  }
  function cross(a,b) { return a[0]*b[1]-a[1]*b[0]; }
  function segmentInside(a,b,polygon) {
    const signed=polygon.reduce((sum,p,i)=>sum+cross(p,polygon[(i+1)%polygon.length]),0),orientation=signed>=0?1:-1,delta=[b[0]-a[0],b[1]-a[1]];
    let lo=0,hi=1;
    for(let i=0;i<polygon.length;i++) {
      const p=polygon[i],next=polygon[(i+1)%polygon.length],edge=[next[0]-p[0],next[1]-p[1]],c=orientation*cross(edge,[a[0]-p[0],a[1]-p[1]]),slope=orientation*cross(edge,delta);
      if(Math.abs(slope)<1e-10){if(c<-1e-9)return null;continue;}
      const crossing=-c/slope;if(slope>0)lo=Math.max(lo,crossing);else hi=Math.min(hi,crossing);
      if(lo>hi+1e-10)return null;
    }
    return [clamp(lo),clamp(hi)];
  }
  function visibleSegment(a,b,polygon) {
    const hidden=segmentInside(a,b,polygon),at=value=>[mix(a[0],b[0],value),mix(a[1],b[1],value)];
    if(!hidden||hidden[1]-hidden[0]<1e-10)return {pieces:[[a,b]],hidden:0};
    const pieces=[];if(hidden[0]>1e-10)pieces.push([a,at(hidden[0])]);if(hidden[1]<1-1e-10)pieces.push([at(hidden[1]),b]);
    return {pieces,hidden:hidden[1]-hidden[0]};
  }
  function occlusionModel(time,recording,width) {
    const shift=recording?0:.055*Math.sin(time*Math.PI/2.8),lift=recording?0:2.5*Math.sin(time*Math.PI/2.8);
    const polygons=[[[.09,12],[.56,8],[.68,24],[.2,28]],[[.34,20],[.78,13],[.92,30],[.46,37]].map(p=>[p[0]+shift,p[1]+lift])].map(poly=>poly.map(p=>[5+p[0]*(width-10),p[1]]));
    const front=recording?mod(Math.floor(time/1.4),2):0,back=1-front;
    const edges=polygons[back].map((a,i)=>{const b=polygons[back][(i+1)%4];return {a,b,...visibleSegment(a,b,polygons[front])};});
    return {polygons,front,back,edges};
  }
  function occlusion(time) {
    const m=occlusionModel(time,state.mode==='record',w);
    m.edges.forEach(edge=>edge.pieces.forEach(piece=>line(piece,.76)));
    const front=m.polygons[m.front];line([...front,front[0]],.96);line([front[0],front[1]],.96,accent());
  }
  const renderers={moment,marginal,area,registration,occlusion};
  function draw() { ctx.clearRect(0,0,w,44);ctx.save();ctx.beginPath();ctx.rect(0,0,w,44);ctx.clip();renderers[state.style](t);ctx.restore(); }
  function sync() {
    root.querySelectorAll('[data-style]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.style===state.style)));
    root.querySelectorAll('[data-mode]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===state.mode)));
    const description=descriptions[state.style][state.mode==='record'?1:0];caption.textContent=description;canvas.setAttribute('aria-label',names[state.style]+': '+description);
    root.querySelector('[data-record]').hidden=state.mode!=='record';pause.textContent=state.paused?'Devam et':'Duraklat';pause.setAttribute('aria-pressed',String(state.paused));draw();schedule();
  }
  function resize() { w=Math.max(1,canvas.getBoundingClientRect().width);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=44*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw(); }
  function schedule() { if(!raf&&!state.paused&&visible&&!document.hidden&&root.isConnected) { last=0;raf=requestAnimationFrame(frame); } }
  function frame(now) { raf=0;if(state.paused||!visible||document.hidden||!root.isConnected)return;if(!last)last=now;const elapsed=now-last;if(elapsed>=1000/30){t+=Math.min(elapsed/1000,.07);last=now;draw();}raf=requestAnimationFrame(frame); }
  root.querySelectorAll('[data-style]').forEach(el=>el.addEventListener('click',()=>{state.style=el.dataset.style;sync();}));
  root.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>{state.mode=el.dataset.mode;sync();}));
  pause.addEventListener('click',()=>{state.paused=!state.paused;sync();});
  reduced.addEventListener('change',()=>{state.paused=reduced.matches;sync();});
  document.addEventListener('visibilitychange',schedule);
  new ResizeObserver(resize).observe(canvas);
  new IntersectionObserver(entries=>{
    const latest=entries.filter(entry=>entry.target===root).reduce((a,b)=>!a||b.time>=a.time?b:a,null);
    if(latest){visible=latest.isIntersecting;schedule();}
  }).observe(root);
  resize();sync();
  if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.vi-phone'),onChange:sync});tweak.addToggle(state,'accent',{label:'Kehribar vurgu'});}
})();
</script>
