<div id="iwr-night-pocket" aria-label="Set 03: Pocket Machines, beş hareketli ses ekranı">
  <div class="viz-controls">
    <button type="button" class="btn" data-mode="play" aria-pressed="true">Çalma</button>
    <button type="button" class="btn" data-mode="record" aria-pressed="false">Kayıt</button>
    <button type="button" class="btn btn-ghost" data-pause aria-pressed="false">Duraklat</button>
    <span class="text-small text-muted">Örnek ses ritmi · sessiz demo</span>
  </div>
  <div class="np-layout">
    <div class="np-stage">
      <div class="np-phone" aria-label="iwrzwr: Pocket Machines önizlemesi">
        <div class="np-header">
          <div class="np-status" aria-hidden="true"><span>9:41</span><span data-record hidden>REC</span><span>••• &nbsp; ▰</span></div>
          <div class="np-controls">
            <div class="np-circle" aria-hidden="true"></div>
            <canvas role="img" aria-label="Segment Relay: sabit segmentler arasında sinyal aktarımı"></canvas>
            <div class="np-circle" aria-hidden="true"><i data-lucide="plus"></i></div>
          </div>
        </div>
        <div class="np-pads" aria-hidden="true"><div><i data-lucide="mic"></i></div><div><i data-lucide="mic"></i></div></div>
      </div>
      <div class="text-small text-muted np-spec">126px header · 44px alan · 24px boşluk</div>
    </div>
    <div class="np-options" role="group" aria-label="Pocket Machines seçenekleri">
      <button type="button" class="btn btn-block" data-style="relay" aria-pressed="true">1 · Segment Relay</button>
      <button type="button" class="btn btn-block" data-style="treaty" aria-pressed="false">2 · Compression Treaty</button>
      <button type="button" class="btn btn-block" data-style="loom" aria-pressed="false">3 · Splice Loom</button>
      <button type="button" class="btn btn-block" data-style="orbit" aria-pressed="false">4 · Orbit Punchcard</button>
      <button type="button" class="btn btn-block" data-style="hold" aria-pressed="false">5 · Sample Hold Ladder</button>
    </div>
  </div>
  <div class="np-caption" data-description aria-live="polite">Sinyal, özel bir segment alfabesindeki kontakları sırayla açıyor.</div>
</div>
<style>
  #iwr-night-pocket .np-layout { display:grid; grid-template-columns:minmax(0,402px) minmax(190px,1fr); gap:24px; align-items:center; margin-top:20px; }
  #iwr-night-pocket .np-stage { min-width:0; }
  #iwr-night-pocket .np-options { display:grid; gap:8px; }
  #iwr-night-pocket .np-phone { --np-screen:#000; --np-pad:#cdcdcd; --np-divider:#b6b6b6; --np-ink:#f1f0e8; color:var(--np-ink); background:var(--np-pad); border-radius:30px; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
  #iwr-night-pocket .np-header { height:126px; position:relative; background:var(--np-screen); border-radius:0 0 32px 40px; }
  #iwr-night-pocket .np-status { position:absolute; top:24px; left:28px; right:28px; display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:500; }
  #iwr-night-pocket [data-record] { color:#ff8141; font-family:ui-monospace,monospace; font-size:11px; }
  #iwr-night-pocket [hidden] { display:none; }
  #iwr-night-pocket .np-controls { position:absolute; top:62px; left:20px; right:20px; display:flex; align-items:center; gap:24px; height:44px; }
  #iwr-night-pocket .np-circle { width:44px; height:44px; flex:none; display:grid; place-items:center; border-radius:50%; background:#141414; box-shadow:inset 0 0 0 1px #303030; }
  #iwr-night-pocket .np-circle svg { width:20px; height:20px; stroke-width:1.5; }
  #iwr-night-pocket canvas { display:block; height:44px; width:100%; flex:1; min-width:0; }
  #iwr-night-pocket .np-pads { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:var(--np-divider); }
  #iwr-night-pocket .np-pads>div { display:grid; place-items:center; height:120px; background:var(--np-pad); color:#929292; }
  #iwr-night-pocket .np-pads svg { width:18px; height:18px; }
  #iwr-night-pocket .np-spec { margin-top:10px; }
  #iwr-night-pocket .np-caption { margin-top:16px; min-height:44px; }
  @media(max-width:630px) { #iwr-night-pocket .np-layout { grid-template-columns:minmax(0,1fr); gap:18px; } #iwr-night-pocket .np-stage { width:100%; max-width:402px; margin:auto; } }
</style>
<script>
(() => {
  const root=document.getElementById('iwr-night-pocket');
  const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d');
  const pause=root.querySelector('[data-pause]'),caption=root.querySelector('[data-description]');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const state={style:'relay',mode:'play',paused:reduced.matches,accent:true,gain:.82};
  const names={relay:'Segment Relay',treaty:'Compression Treaty',loom:'Splice Loom',orbit:'Orbit Punchcard',hold:'Sample Hold Ladder'};
  const descriptions={
    relay:['Sinyal, özel bir segment alfabesindeki kontakları sırayla açıyor.','Her darbe bir segmenti yazıp kilitliyor; tamamlanan modül yerinde kalıyor.'],
    treaty:['Üst ve alt dişler, sesin basıncıyla ortak bir aralık bırakıyor.','Yeni darbeler sağda iz bırakıyor; karşı kuvvet biraz gecikerek cevaplıyor.'],
    loom:['Üç ince ses şeridi, bir kesme noktasında yer değiştiriyor.','Yeni şerit ortada dokunuyor, tamamlanan parçalar yanlara ayrılıyor.'],
    orbit:['Üç farklı uzunlukta ritim halkası, sabit okuma çizgisinde buluşuyor.','Halkalar sabit; kayıt kafaları geçtikleri duraklara yeni delikler yazıyor.'],
    hold:['Sabit seviyeleri okuyan bir imleç: küçük bir örnek-tut hafızası.','Her darbe yalnız bir basamağı güncelliyor; diğerleri son değerini tutuyor.']
  };
  const white='#f1f0e8',amber='#ff963e';
  let w=226,dpr=1,t=2.4,last=0,raf=0,visible=true;
  const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
  // Live sound seam: iwrSignal exists only inside the archive gallery. Without it, or with sound off, nothing changes.
  const hearing=()=>typeof iwrSignal!=='undefined'&&iwrSignal.active?iwrSignal:null;
  // Geometry reads audio features. Transport and history have separate clocks.
  const charge=(band='amp',age=0)=>{const s=hearing();return s?clamp(s.bandAt?s.bandAt(band,age):(s[band]??s.level??0)):0;};
  const strike=(kind='kick')=>{const s=hearing();return s?.eventAt?s.eventAt(kind):{n:Math.floor(s?.beat??0),age:s?.[kind+'Age']??30};};
  // Time-driven machines move on the beat and rest between hits; the studies' own dt clamps still apply first.
  const conduct=()=>{const s=hearing();return s?0.25+4.2*s.hit:1;};
  // Whatever time env() is asked for, answer from the last 3.4 s that was actually heard.
  const heardEnv=(s,time)=>{const age=Math.max(0,t-time);return 0.12+0.88*Math.max(s.levelAt(age),s.hitAt(age));};
  const mod=(x,n)=>(x%n+n)%n;
  const fract=x=>x-Math.floor(x);
  const hash=n=>fract(Math.sin(n*127.1+43.7)*43758.5453);
  const accent=()=>state.accent?amber:white;
  // Synthetic energy and transport clocks. No compressor, spectral or pitch measurement.
  function env(time) { const s=hearing(); if(s)return clamp(heardEnv(s,time)*state.gain); return clamp((.15+.55*Math.pow(Math.max(0,Math.sin(time*2.7)),6)+.28*Math.pow(Math.max(0,Math.sin(time*6.1+1)),12))*state.gain); }
  function ink(alpha=1,color=white) { ctx.globalAlpha=clamp(alpha);ctx.fillStyle=color;ctx.strokeStyle=color; }
  function rect(x,y,width,height,alpha=1,color=white) { ink(alpha,color);ctx.fillRect(Math.round(x*dpr)/dpr,Math.round(y*dpr)/dpr,width,height); }
  function line(points,alpha=1,color=white) { if(!points.length)return;ink(alpha,color);ctx.lineWidth=1;ctx.lineCap='butt';ctx.lineJoin='miter';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke(); }
  function box(x,y,width,height,alpha=1,color=white) { line([[x,y],[x+width,y],[x+width,y+height],[x,y+height],[x,y]],alpha,color); }
  function arc(x,y,r,a,b,alpha=1,color=white) { ink(alpha,color);ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,r,a,b);ctx.stroke(); }
  function relay(time) {
    const count=Math.max(3,Math.min(6,Math.floor(w/33))),pitch=(w-4)/count,step=hearing()?strike('hat').n:Math.floor(time*4),phase=hearing()?clamp(strike('hat').age/.16):fract(time*4);
    for(let i=0;i<count;i++) {
      const x=2+i*pitch,span=pitch-8,middle=x+span*.5;
      const live=mod(step,count)===i,mask=hearing()?Math.min(3,Math.floor(charge('amp',i*.08)*4)):state.mode==='record'?mod(step-i+count,4):live?3:0;
      const segments=[[[x,12],[x+span,12]],[[middle,12],[middle,32]],[[x,32],[x+span,32]]];
      segments.forEach((points,k)=>line(points,mask>=k+1?.95:.13,live?accent():white));
      rect(x,21,2,2,.5);rect(x+span-1,21,2,2,.5);
      if(i<count-1)line([[x+span+3,22],[x+pitch-3,22]],.25);
      if(live)rect(x+span*phase,20.5,3,3,1,accent());
    }
  }
  function treaty(time) {
    const pitch=4,n=Math.ceil(w/pitch),speed=state.mode==='record'?1:0.6;
    for(let i=0;i<n;i++) {
      const u=i/(n-1),age=(1-u)*4.4;
      const s=hearing();
      const a=s?clamp((.12+.88*Math.max(s.levelAt(age),s.hitAt(age)))*state.gain):env(time*speed-age);
      const b=s?clamp((.12+.88*Math.max(s.levelAt(age+.25),s.hitAt(age+.25)))*state.gain):env(time*speed-age-.25);
      const low=2+17*a,high=2+Math.max(0,b-.3)*20;
      rect(i*pitch,22+3,1,low,.78);
      rect(i*pitch,22-3-high,1,high,.85,accent());
      if(a>.57)rect(i*pitch,22+3+low+2,1,1,.4);
    }
    line([[0,22],[w,22]],.16);
    if(state.mode==='record')line([[w-1,3],[w-1,41]],.75,accent());
  }
  function loom(time) {
    const middle=w*.52,ys=[10,22,34],speed=state.mode==='record'?24:19;
    if(state.mode==='record') {
      for(let lane=0;lane<3;lane++) {
        const y=ys[lane];
        line([[0,y],[middle-28,y],[middle,22],[middle+28,y],[w,y]],.14);
        for(const direction of [-1,1])for(let j=0;j<Math.ceil(w/48);j++) {
          const distance=j*25+mod(time*speed+lane*6,25),x=middle+direction*distance;
          const len=6+hash(j+lane*13)*10;
          const mapY=px=>22+(y-22)*clamp(Math.abs(px-middle)/28);
          const end=x+direction*len;
          line([[x,mapY(x)],[end,mapY(end)]],distance<25?1:.65,distance<25?accent():white);
          line([[end,mapY(end)-2],[end,mapY(end)+2]],.5);
        }
      }
      rect(middle-1,18-env(time)*9,2,8+env(time)*18,1,accent());
      return;
    }
    for(let lane=0;lane<3;lane++) {
      const y=ys[lane],next=ys[(lane+1)%3];
      line([[0,y],[middle-10,y],[middle+10,next],[w,next]],.16);
      for(let j=-1;j<Math.ceil(w/24)+2;j++) {
        const raw=j*24-mod(time*speed+lane*8,24),len=7+(hearing()?charge(['low','mid','high'][lane],Math.abs(j)*.06):hash(j+lane*9))*11;
        const mapY=x=>x<middle-10?y:x>middle+10?next:y+(next-y)*(x-(middle-10))/20;
        const points=[];
        for(let k=0;k<=6;k++){const x=raw+k/6*len;points.push([x,mapY(x)]);}
        const live=raw<middle&&raw+len>middle;
        line(points,live?1:.75,live?accent():white);
        line([[raw,mapY(raw)-2],[raw,mapY(raw)+2]],.45);
        if(state.mode==='record'&&Math.abs(raw-middle)<20)rect(raw,mapY(raw)-1,3,3,.9,accent());
      }
    }
    line([[middle-6,2],[middle+6,2]],.6,accent());
    line([[middle-6,42],[middle+6,42]],.6,accent());
  }
  function orbit(time) {
    const count=w<160?2:3,pitch=w/count;
    for(let ring=0;ring<count;ring++) {
      const r=hearing()?8+charge(['low','mid','high'][ring])*8:16;
      const cx=pitch*(ring+.5),n=[12,9,7][ring],rotation=state.mode==='record'?0:time*(.45+ring*.11),head=mod(time*(1.1+ring*.17),Math.PI*2);
      arc(cx,22,r,0,Math.PI*2,.16);
      for(let i=0;i<n;i++) {
        const angle=i/n*Math.PI*2+rotation-Math.PI/2,on=hearing()?i<n*charge(['low','mid','high'][ring]):mod(i*5+ring*3,n)<n*.45;
        const fresh=state.mode==='record'&&mod(head-i/n*Math.PI*2,Math.PI*2)<.8;
        const hit=state.mode==='play'&&Math.abs(Math.sin(angle+Math.PI/2))<.17&&Math.cos(angle+Math.PI/2)>0;
        const x=cx+Math.cos(angle)*r,y=22+Math.sin(angle)*r;
        if(on||fresh)rect(x-1,y-1,2,2,hit||fresh?1:.65,hit||fresh?accent():white);
        else rect(x,y,1,1,.18);
      }
      const a=state.mode==='record'?head-Math.PI/2:-Math.PI/2;
      line([[cx+Math.cos(a)*6,22+Math.sin(a)*6],[cx+Math.cos(a)*20,22+Math.sin(a)*20]],.85,accent());
      rect(cx-1,21,2,2,.65);
    }
  }
  function hold(time) {
    const n=Math.max(4,Math.min(7,Math.floor(w/29))),pitch=(w-4)/n,step=hearing()?strike('note').n:Math.floor(time*2.7),active=mod(step,n),phase=fract(time*2.7);
    let previous;
    for(let i=0;i<n;i++) {
      const cycle=state.mode==='record'?Math.floor((step-i+n)/n):1;
      const target=7+(hearing()?charge('amp',Math.max(0,strike('note').age+mod(step-i,n)*.28-.035)):hash(i+cycle*17))*29,old=7+hash(i+(cycle-1)*17)*29;
      // Latch: only the currently written slot moves; stored values remain fixed.
      const y=state.mode==='record'&&i===active?old+(target-old)*clamp(phase/.22):target;
      const x=2+i*pitch;
      if(previous)line([[previous.x,previous.y],[x,previous.y],[x,y]],.16);
      line([[x,y],[x+pitch-5,y]],i===active?1:.72,i===active?accent():white);
      rect(x,39,2,1,.2);rect(x+pitch-5,39,2,1,.2);
      if(i===active) {box(x+pitch*.5-2,y-2,4,4,1,accent());line([[x+pitch*.5,3],[x+pitch*.5,7]],.65,accent());}
      previous={x:x+pitch-5,y};
    }
  }
  const renderers={relay,treaty,loom,orbit,hold};
  function draw() { ctx.clearRect(0,0,w,44);ctx.save();ctx.beginPath();ctx.rect(0,0,w,44);ctx.clip();renderers[state.style](t);ctx.restore(); }
  function sync() {
    root.querySelectorAll('[data-style]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.style===state.style)));
    root.querySelectorAll('[data-mode]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===state.mode)));
    const description=descriptions[state.style][state.mode==='record'?1:0];caption.textContent=description;canvas.setAttribute('aria-label',names[state.style]+': '+description);
    root.querySelector('[data-record]').hidden=state.mode!=='record';
    pause.textContent=state.paused?'Devam et':'Duraklat';pause.setAttribute('aria-pressed',String(state.paused));draw();schedule();
  }
  function resize() { w=Math.max(1,canvas.getBoundingClientRect().width);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=44*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw(); }
  function schedule() { if(!raf&&!state.paused&&visible&&!document.hidden&&root.isConnected) { last=0;raf=requestAnimationFrame(frame); } }
  function frame(now) { raf=0;if(state.paused||!visible||document.hidden||!root.isConnected)return;if(!last)last=now;const elapsed=now-last;if(elapsed>=1000/30){const heard=hearing();if(heard?.source==='demo')t=heard.songTime;else t+=Math.min(elapsed/1000,.07)*conduct();last=now;draw();}raf=requestAnimationFrame(frame); }
  root.querySelectorAll('[data-style]').forEach(el=>el.addEventListener('click',()=>{state.style=el.dataset.style;sync();}));
  root.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>{state.mode=el.dataset.mode;sync();}));
  pause.addEventListener('click',()=>{state.paused=!state.paused;sync();});
  reduced.addEventListener('change',()=>{state.paused=reduced.matches;sync();});
  document.addEventListener('visibilitychange',schedule);
  new ResizeObserver(resize).observe(canvas);
  new IntersectionObserver(entries=>{const latest=entries.reduce((a,b)=>b.target===root&&(!a||b.time>=a.time)?b:a,null);if(latest){visible=latest.isIntersecting;schedule();}}).observe(root);
  resize();sync();
  if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.np-phone'),onChange:sync});tweak.addToggle(state,'accent',{label:'Kehribar vurgu'});tweak.addSlider(state,'gain',{label:'Tepki yoğunluğu',min:.3,max:1.2,step:.1});}
})();
</script>
