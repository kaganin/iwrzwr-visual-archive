<div id="matrix-directions-v1">
  <div class="viz-controls"><button type="button" class="btn" data-pause aria-pressed="false">Duraklat</button><span class="text-small">Örnek ritim · sessiz demo</span></div>
  <div class="direction-grid"></div>
</div>
<style>
#matrix-directions-v1 .direction-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-top:16px}
#matrix-directions-v1 figure{margin:0;min-width:0}
#matrix-directions-v1 .matrix-screen{background:#000;padding:28px 12px}
#matrix-directions-v1 canvas{display:block;width:100%;height:44px}
#matrix-directions-v1 figcaption{margin-top:8px;color:var(--foreground)}
#matrix-directions-v1 .direction-label{display:block;margin-top:3px;color:var(--muted-foreground)}
@media(max-width:520px){#matrix-directions-v1 .direction-grid{grid-template-columns:1fr}}
</style>
<script>
(()=>{
const root=document.getElementById('matrix-directions-v1');
const studies=[
 ['01 · Gravity Curtain','Yukarıdan aşağıya','Hücre perdeleri aşağıya akar; kırmızı ön kenarı gri izler takip eder.'],
 ['02 · Oblique Relay','Sol üstten sağ alta','Paralel çapraz hücre şeritleri tek bir yönde ilerler.'],
 ['03 · Twin Helix','Birbirine dolanan iki akış','İki hücre bandı karşıt fazlarda ilerleyip ortada kesişir.'],
 ['04 · Spiral Sink','Dönerek merkeze','Spiral hücre kolları dönerek merkeze çekilir.'],
 ['05 · Corner Tide','Köşeden karşı köşeye','Köşeler sırayla dalga üretir; hücre halkaları karşı kenarlara genişler.']
];
const grid=root.querySelector('.direction-grid');
const panels=studies.map(([name,direction,description])=>{
 const figure=document.createElement('figure'),screen=document.createElement('div'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption'),label=document.createElement('span');
 screen.className='matrix-screen';canvas.setAttribute('role','img');canvas.setAttribute('aria-label',name+'. '+description);caption.textContent=name;label.className='direction-label text-small';label.textContent=direction;caption.append(label);screen.append(canvas);figure.append(screen,caption);grid.append(figure);
 return {canvas,ctx:canvas.getContext('2d'),width:300};
});
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),pause=root.querySelector('[data-pause]');
let paused=reduced.matches,visible=true,time=1.8,last=0,raf=0;
const tau=Math.PI*2,mod=(n,d)=>(n%d+d)%d,fract=x=>x-Math.floor(x);
function draw(){
 panels.forEach((panel,id)=>{
  const {ctx,width}=panel,cols=Math.max(12,Math.floor((width-4)/4)),left=(width-cols*4)/2;
  ctx.clearRect(0,0,width,44);
  for(let c=0;c<cols;c++)for(let r=0;r<10;r++){
   const u=(c/(cols-1)-.5)*2,v=(r/9-.5)*2;
   let strength=0,red=false;
   if(id===0){
    const head=mod(time*2.2+Math.cos(u*3.5)*1.3,15)-2;
    const age=mod(head-r,15),gate=mod(c,4)!==3;
    if(gate&&age<5){strength=age<.85?3:age<2.6?2:1;red=age<.85;}
   }else if(id===1){
    const flow=mod(u*1.5+v*.55-time*.24,1.25);
    if(flow<.32){strength=flow<.07?3:flow<.17?2:1;red=flow<.07;}
   }else if(id===2){
    const phase=u*4.3-time*.85,track=Math.sin(phase)*.72;
    const d1=Math.abs(v-track),d2=Math.abs(v+track);
    if(d1<.23||d2<.23){strength=Math.min(d1,d2)<.12?3:1;red=d1<.12&&mod(c-Math.floor(time*5),17)<5;}
    if(mod(c,7)===0&&v>Math.min(track,-track)&&v<Math.max(track,-track))strength=Math.max(strength,1);
   }else if(id===3){
    const radius=Math.hypot(u,v*.92),angle=Math.atan2(v*.92,u);
    const turn=mod(angle/tau+radius*.95+time*.11,1/3);
    if(radius<1.04&&radius>.1&&turn<.09){strength=turn<.027?3:turn<.055?2:1;red=turn<.027&&mod(radius+time*.11,.45)<.14;}
    if(radius<.11){strength=3;red=true;}
   }else{
    const corner=Math.floor(time/7)%4,phase=fract(time/7),corners=[[-1,-1],[1,1],[1,-1],[-1,1]],origin=corners[corner];
    const distance=Math.hypot(u-origin[0],(v-origin[1])*.65),front=phase*3.1;
    const age=front-distance;
    if(age>=0&&age<1.25){const band=mod(age,.34);if(band<.15){strength=age<.15?3:age<.65?2:1;red=age<.15;}}
   }
   if(strength){ctx.fillStyle=red?'#FF0000':strength===3?'#FFFFFF':strength===2?'#8F8F8F':'#525252';ctx.fillRect(left+c*4,3+r*4,2,2);}
  }
 });
}
function resize(){const dpr=Math.min(devicePixelRatio||1,2);panels.forEach(p=>{p.width=Math.max(1,p.canvas.getBoundingClientRect().width);p.canvas.width=Math.round(p.width*dpr);p.canvas.height=44*dpr;p.ctx.setTransform(dpr,0,0,dpr,0,0);});draw();}
function sync(){pause.textContent=paused?'Devam et':'Duraklat';pause.setAttribute('aria-pressed',String(paused));}
function schedule(){if(!raf&&!paused&&visible&&!document.hidden&&root.isConnected){last=0;raf=requestAnimationFrame(frame);}}
function frame(now){raf=0;if(paused||!visible||document.hidden||!root.isConnected)return;if(!last)last=now;const delta=now-last;if(delta>=1000/30){time+=Math.min(delta/1000,.08);last=now;draw();}raf=requestAnimationFrame(frame);}
pause.addEventListener('click',()=>{paused=!paused;sync();schedule();});
reduced.addEventListener('change',e=>{paused=e.matches;sync();schedule();});
document.addEventListener('visibilitychange',schedule);
new ResizeObserver(resize).observe(grid);
new IntersectionObserver(entries=>{visible=entries[entries.length-1].isIntersecting;schedule();}).observe(root);
sync();resize();schedule();
})();
</script>
