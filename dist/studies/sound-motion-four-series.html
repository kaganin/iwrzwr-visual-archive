<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ses ve hareket · 4 × 5 · iwrzwr</title><style>:root{color-scheme:dark;--background:#000;--foreground:#eee;--muted-foreground:#999}*{box-sizing:border-box}body{margin:0;padding:24px;background:#000;color:#eee;font:16px/1.5 Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}.viz-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:24px}.btn{color:#bbb;background:#141414;border:1px solid #333;border-radius:6px;min-height:44px;padding:9px 14px;text-align:left}.btn[aria-pressed=true]{color:#fff;border-color:#ddd;background:#262626}.btn-block{width:100%}.text-small{font-size:14px}.text-muted{color:#999}:focus-visible{outline:2px solid #fff;outline-offset:3px}[hidden]{display:none!important}h3{font-size:18px;font-weight:500}figcaption{font-size:16px}canvas{max-width:100%}@media(max-width:520px){body{padding:16px}}</style><link rel="stylesheet" href="../typography.css"><script src="../motion-runtime.js"></script></head><body><div id="sound-motion-four">
  <div class="viz-controls">
    <button class="btn" type="button" data-audio aria-pressed="false">Örnek sesi aç</button>
    <button class="btn" type="button" data-pause aria-pressed="false">Duraklat</button>
    <span class="text-small" data-status role="status" aria-live="polite">Sessiz önizleme · 108 BPM</span>
  </div>
  <div data-series></div>
</div>
<style>
#sound-motion-four .sound-series{margin-top:28px}
#sound-motion-four h3{margin:0 0 14px}
#sound-motion-four .sound-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 24px}
#sound-motion-four figure{margin:0;min-width:0}
#sound-motion-four .sound-screen{background:#000;padding:26px 12px}
#sound-motion-four canvas{display:block;width:100%;height:44px}
#sound-motion-four figcaption{margin-top:8px;color:var(--foreground)}
#sound-motion-four .sound-mapping{display:block;margin-top:3px;color:var(--muted-foreground)}
@media(max-width:520px){#sound-motion-four .sound-grid{grid-template-columns:1fr}}
</style>
<script>
(()=>{
'use strict';
const root=document.getElementById('sound-motion-four');
const series=[
 {name:'01 / Darbe ve sekme',items:[
 ['Kick Ricochet','Bas vuruşu → sekme ve hız'],
 ['Snare Prism','Trampet → dört yöne ayrılan iz'],
 ['Hat Escapement','Hi-hat → adım, tiz enerji → diş yüksekliği'],
 ['Impact Cage','Bas → kafesin sıkışması'],
 ['Pluck Rebound','Nota atağı → yaylanma, kuyruk → sönüm']]},
 {name:'02 / Yörünge ve faz',items:[
 ['Envelope Orbit','Ses seviyesi → yarıçap, enerji → dönüş'],
 ['Band Satellites','Bas / orta / tiz → üç ayrı yörünge'],
 ['Phase Gyro','Bas → dış halka, tiz → iç eksen'],
 ['Resonance Petals','Orta frekans → açılan taç yapraklar'],
 ['Stereo Sling','Sol / sağ enerji → ağırlık merkezi']]},
 {name:'03 / Gerilim ve geometri',items:[
 ['String Bridge','Ses dalgası → telin gerçek yer değiştirmesi'],
 ['Fold Bank','Bas → sıkışma, orta frekans → katlanma'],
 ['Coupled Frames','Üç frekans bandı → üç bağlı çerçeve'],
 ['Pulse Louvers','Tiz → kanat açısı, bas → açıklık'],
 ['Spectral Fan','Sekiz frekans bandı → sekiz kolun boyu']]},
 {name:'04 / İz ve hafıza',items:[
 ['Echo Chambers','Trampet → gecikmeli hücre yankıları'],
 ['Memory Loom','Geçmiş ses seviyesi → örülen şerit'],
 ['Attack Ledger','Bas / orta / tiz → üç satırlı ses geçmişi'],
 ['Decay Halo','Ses kuyruğu → giderek sönen halkalar'],
 ['Diffusion Bed','Bas vuruşu → yayılan, sönen hücreler']]}
];
const container=root.querySelector('[data-series]'),panels=[];
series.forEach((group,g)=>{
 const section=document.createElement('section'),heading=document.createElement('h3'),grid=document.createElement('div');
 section.className='sound-series';heading.textContent=group.name;grid.className='sound-grid';section.append(heading,grid);container.append(section);
 group.items.forEach(([name,mapping],i)=>{
  const figure=document.createElement('figure'),screen=document.createElement('div'),c=document.createElement('canvas'),caption=document.createElement('figcaption'),label=document.createElement('span');
  screen.className='sound-screen';c.setAttribute('role','img');c.setAttribute('aria-label',name+'. '+mapping);caption.textContent=String(i+1).padStart(2,'0')+' · '+name;label.className='sound-mapping text-small';label.textContent=mapping;caption.append(label);screen.append(c);figure.append(screen,caption);grid.append(figure);
  panels.push({id:g*5+i,c,figure,ctx:c.getContext('2d'),w:300,visible:true});
 });
});
// One original, local stereo sound loop. The silent preview and audible mode
// read the SAME PCM-derived envelopes, spectra and waveform samples.
const rate=32000,step=60/108/2,N=Math.round(step*32*rate),duration=N/rate;
const pcm=[new Float32Array(N),new Float32Array(N)],mono=new Float32Array(N);
const events={kick:[0,6,8,16,22],snare:[4,12,20],hat:[2,3,6,10,11,14,18,19,22],note:[1,7,9,15,17,23]};
const notes=[146.83,220,196,293.66,164.81,220];
let seed=17471;
function noise(){seed=(Math.imul(seed,1664525)+1013904223)|0;return (seed>>>0)/2147483648-1;}
function voice(type,at,index){
 const length=type==='note'?.85:type==='kick'?.6:type==='snare'?.28:.1;
 const first=Math.round(at*rate),count=Math.round(length*rate),pan=type==='note'?(index%2?.65:-.65):type==='hat'?(index%2?.4:-.4):0;
 const gainL=Math.sqrt((1-pan)/2),gainR=Math.sqrt((1+pan)/2);
 let previousNoise=0;
 for(let j=0;j<count&&first+j<N;j++){
  const t=j/rate,rise=Math.min(1,t/.003);let value=0;
  if(type==='kick')value=Math.sin(2*Math.PI*(48*t+120/32*(1-Math.exp(-32*t))))*Math.exp(-12*t)*.8*rise;
  if(type==='snare')value=(noise()*.68+Math.sin(2*Math.PI*185*t)*.25)*Math.exp(-23*t)*rise*.5;
  if(type==='hat'){const n=noise();value=(n-previousNoise)*Math.exp(-65*t)*rise*.17;previousNoise=n;}
  if(type==='note'){const f=notes[index%notes.length];value=(Math.sin(2*Math.PI*f*t)+.3*Math.sin(2*Math.PI*f*2*t)+.12*Math.sin(2*Math.PI*f*4*t))*Math.exp(-6.8*t)*rise*.35;}
  pcm[0][first+j]+=value*gainL;pcm[1][first+j]+=value*gainR;
 }
}
Object.entries(events).forEach(([kind,steps])=>steps.forEach((s,i)=>voice(kind,s*step,i)));
let peak=0;for(let i=0;i<N;i++)peak=Math.max(peak,Math.abs(pcm[0][i]),Math.abs(pcm[1][i]));
for(let i=0;i<N;i++){pcm[0][i]*=.24/peak;pcm[1][i]*=.24/peak;mono[i]=(pcm[0][i]+pcm[1][i])*.5;}
const hop=400,frameCount=Math.ceil(N/hop),frameTime=hop/rate;
const cutoffs=[100,220,480,1000,2200,4800,9600],coeff=cutoffs.map(f=>1-Math.exp(-2*Math.PI*f/rate));
const filtered=new Float64Array(7),frames=[],maxima=new Float64Array(8);
let peakRms=0;
for(let start=0;start<N;start+=hop){
 const sums=new Float64Array(8);let all=0,l=0,r=0;
 for(let i=start;i<Math.min(start+hop,N);i++){
  const sample=mono[i];let previous=0;
  for(let b=0;b<7;b++){filtered[b]+=coeff[b]*(sample-filtered[b]);const band=filtered[b]-previous;sums[b]+=band*band;previous=filtered[b];}
  sums[7]+=(sample-previous)**2;all+=sample*sample;l+=pcm[0][i]**2;r+=pcm[1][i]**2;
 }
 const bins=Array.from(sums,v=>Math.sqrt(v/hop));bins.forEach((v,i)=>maxima[i]=Math.max(maxima[i],v));
 const rms=Math.sqrt(all/hop);peakRms=Math.max(peakRms,rms);frames.push({bins,rms,l:Math.sqrt(l/hop),r:Math.sqrt(r/hop),travel:0});
}
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),mod=(v,n)=>(v%n+n)%n,frac=v=>v-Math.floor(v),tau=Math.PI*2,tri=v=>1-4*Math.abs(frac(v)-.5);
let travel=0;
frames.forEach(f=>{
 f.bins=f.bins.map((v,i)=>clamp(v/(maxima[i]*.8||1)));f.amp=clamp(f.rms/(peakRms*.8));
 f.low=(f.bins[0]+f.bins[1])/2;f.mid=(f.bins[2]+f.bins[3]+f.bins[4])/3;f.high=(f.bins[5]+f.bins[6]+f.bins[7])/3;
 f.balance=(f.r-f.l)/(f.l+f.r+.0001);f.left=clamp(f.l/(peakRms*.9));f.right=clamp(f.r/(peakRms*.9));
 travel+=Math.max(0,f.amp-.025)*frameTime;f.travel=travel;
});
const cycleTravel=travel;
function signal(t){
 const cycle=Math.floor(t/duration),pos=mod(t,duration)/frameTime,i=Math.min(frameCount-1,Math.floor(pos)),j=Math.min(frameCount-1,i+1),q=pos-i,a=frames[i],b=frames[j];
 const f={bins:a.bins.map((v,k)=>v+(b.bins[k]-v)*q)};
 for(const key of ['low','mid','high','amp','balance','left','right','travel'])f[key]=a[key]+(b[key]-a[key])*q;
 f.travel+=cycle*cycleTravel;return f;
}
function hit(t,kind){const sequence=events[kind],local=mod(t,duration);let index=-1;for(let i=0;i<sequence.length;i++)if(sequence[i]*step<=local)index=i;return {age:index<0?local+duration-sequence[sequence.length-1]*step:local-sequence[index]*step,n:Math.floor(t/duration)*sequence.length+index+1};}
function wave(t,u){const at=Math.floor(mod(t-.032+u*.032,duration)*rate);return mono[Math.min(N-1,at)]/(peakRms*3);}
const reduced=matchMedia('(prefers-reduced-motion: reduce)'),soundButton=root.querySelector('[data-audio]'),pauseButton=root.querySelector('[data-pause]'),status=root.querySelector('[data-status]');
let time=1.72,last=0,raf=0,paused=reduced.matches,visible=true,audible=false,context=null,source=null,buffer=null,startTime=0,startOffset=0,audioPending=false;
function sync(){soundButton.textContent=audible?'Sesi kapat':'Örnek sesi aç';soundButton.setAttribute('aria-pressed',String(audible));pauseButton.textContent=paused?'Devam et':'Duraklat';pauseButton.setAttribute('aria-pressed',String(paused));status.textContent=paused?'Duraklatıldı':audible?'Örnek ses açık · 108 BPM':'Sessiz önizleme · 108 BPM';}
function clock(){return audible&&context&&source?startOffset+context.currentTime-startTime:time;}
function stopSound(){if(audible)time=clock();if(source){try{source.stop();}catch(e){}source.disconnect();source=null;}audible=false;sync();}
async function startSound(){
 if(audioPending)return;audioPending=true;soundButton.disabled=true;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('audio-unavailable');
  if(!context)context=new AC();await context.resume();
  if(context.state!=='running')throw new Error('audio-blocked');
  if(!root.isConnected)return;
  if(!buffer){buffer=context.createBuffer(2,N,rate);buffer.copyToChannel(pcm[0],0);buffer.copyToChannel(pcm[1],1);}
  source=context.createBufferSource();source.buffer=buffer;source.loop=true;source.connect(context.destination);
  startOffset=time;startTime=context.currentTime;source.start(0,mod(time,duration));audible=true;paused=false;sync();schedule();
 }catch(error){stopSound();status.textContent='Ses burada açılamadı; sessiz önizleme devam ediyor.';}
 finally{audioPending=false;soundButton.disabled=false;}
}
function drawPanel(panel,t){
 const {ctx,w,id}=panel,f=signal(t),kick=hit(t,'kick'),snare=hit(t,'snare'),hat=hit(t,'hat'),note=hit(t,'note');
 const red='#FF0000',white='#FFFFFF',gray='#8F8F8F',dim='#343434';
 ctx.clearRect(0,0,w,44);ctx.save();ctx.beginPath();ctx.rect(0,0,w,44);ctx.clip();
 const X=x=>4+(x+1)*.5*(w-8),Y=y=>22+y*18;
 function dot(x,y,color=white,size=2,alpha=1){ctx.globalAlpha=clamp(alpha);ctx.fillStyle=color;ctx.fillRect(Math.round(X(x)/4)*4,Math.round(Y(y)/4)*4,size,size);}
 function line(points,color=gray,alpha=1){ctx.globalAlpha=clamp(alpha);ctx.strokeStyle=color;ctx.lineWidth=1;ctx.lineCap='butt';ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(X(x),Y(y)):ctx.moveTo(X(x),Y(y)));ctx.stroke();}
 function ring(cx,cy,rx,ry,color=gray,dotted=true,phase=0){const pts=[];for(let i=0;i<=80;i++){const a=i/80*tau+phase,p=[cx+Math.cos(a)*rx,cy+Math.sin(a)*ry];if(dotted){if(i%2===0)dot(...p,color);}else pts.push(p);}if(!dotted)line(pts,color);}
 function trail(fn,length=.6){for(let j=22;j>=0;j--){const age=j/22*length,s=signal(t-age),p=fn(s,t-age);dot(p[0],p[1],j<3?red:j<9?white:gray,2,s.amp>.02?1:.25);}}
 function box(x,y,rx,ry,color=gray){line([[x-rx,y-ry],[x+rx,y-ry],[x+rx,y+ry],[x-rx,y+ry],[x-rx,y-ry]],color);}
 if(id===0){
  const ricochet=(s,at)=>{const k=hit(at,'kick'),q=k.n*.17+.16*(1-Math.exp(-k.age*6));return [tri(q)*.9,tri(q*3+.13)*.78];};
  line([[-.96,-.84],[-.96,.84]],dim);line([[.96,-.84],[.96,.84]],dim);trail(ricochet,.48);
  const point=ricochet(f,t);if(kick.age<.12)ring(...point,.04+f.low*.09,.1+f.low*.3,red,false);
 }else if(id===1){
  const age=snare.age,reach=clamp(age*1.7),fade=Math.exp(-age*2.7);
  for(const sx of [-1,1])for(const sy of [-1,1])for(let j=0;j<12;j++){const q=Math.max(0,reach-j*.025);dot(sx*q*.9,sy*q*.78,j<2?red:j<5?white:gray,2,fade);}
  box(0,0,.025,.1,f.high>.12?red:dim);
 }else if(id===2){
  for(let i=0;i<24;i++){const x=-.92+i/23*1.84,active=mod(hat.n,24)===i;line([[x,.45],[x,.45-(active?.22+f.high:.16)]],active?red:dim);if(active)dot(x,.58,red);}
  line([[-.95,.48],[.95,.48]],gray);
 }else if(id===3){
  const squeeze=f.low*.3;box(0,0,.86-squeeze,.67-f.low*.32,gray);
  const points=[];for(let i=0;i<=36;i++){const x=-.86+i/36*1.72;points.push([x,Math.sin(i*.55)*f.low*.42]);}line(points,white);
  dot(-.86+squeeze,0,red,3);dot(.86-squeeze,0,red,3);
 }else if(id===4){
  const y=.6-Math.abs(Math.sin(note.age*13))*Math.exp(-note.age*3.1)*1.4;
  const x=tri(note.n*.16)*.72;line([[-.93,.67],[.93,.67]],dim);
  for(let j=12;j>=0;j--){const a=note.age+j*.017,py=.6-Math.abs(Math.sin(a*13))*Math.exp(-a*3.1)*1.4;dot(x-j*.013,py,j===0?red:gray);}
  dot(x,y,red,3);
 }else if(id===5){
  const rx=.22+f.amp*.61,ry=.16+f.amp*.62,a=f.travel*2.8;ring(0,0,rx,ry,gray);
  for(let j=0;j<14;j++)dot(Math.cos(a-j*.055)*rx,Math.sin(a-j*.055)*ry,j<3?red:white);
 }else if(id===6){
  [f.low,f.mid,f.high].forEach((energy,i)=>{const rx=.3+i*.27,ry=.18+energy*.58,a=f.travel*(1.3+i*.9)+i*2;ring(0,0,rx,ry,dim);dot(Math.cos(a)*rx,Math.sin(a)*ry,energy>.25?red:white,3);});
 }else if(id===7){
  for(let axis=0;axis<3;axis++){const points=[],theta=(axis-1)*(.18+f.high*.58),rx=.75-axis*.17,ry=.14+f.low*.5;for(let i=0;i<=64;i++){const a=i/64*tau,x=Math.cos(a)*rx,y=Math.sin(a)*ry;points.push([x*Math.cos(theta)-y*Math.sin(theta)*.35,x*Math.sin(theta)+y*Math.cos(theta)]);}line(points,axis===1?white:dim);const p=points[Math.floor(mod(f.travel*12+axis*19,64))];dot(...p,red);}
 }else if(id===8){
  const points=[];for(let i=0;i<144;i++){const a=i/144*tau,r=.27+f.mid*.4+Math.cos(a*5+f.travel)*f.mid*.16;points.push([Math.cos(a)*r,Math.sin(a)*r]);}
  points.forEach((p,i)=>{if(i%2===0)dot(...p,i%24<4?red:gray);});
 }else if(id===9){
  const center=f.balance*.58,rx=.15+f.amp*.27;line([[-.9,.1],[center,-.2],[.9,.1]],gray);
  ring(center,-.2,rx,.18+f.amp*.36,white);dot(-.9,.1-f.left*.7,red,3);dot(.9,.1-f.right*.7,red,3);
 }else if(id===10){
  for(let layer=-1;layer<=1;layer++){const points=[];for(let i=0;i<=80;i++){const u=i/80;points.push([- .94+u*1.88,wave(t-layer*.002,u)*.75+layer*.12]);}line(points,layer===0?white:dim);}
  dot(-.94,0,red);dot(.94,0,red);
 }else if(id===11){
  for(let r=-2;r<=2;r++){const points=[];for(let i=0;i<17;i++){const x=-.9+i/16*1.8,y=r*.2+tri(i/8+f.travel*.22)*f.mid*.17;points.push([x*(1-f.low*.24),y]);}line(points,r===0?red:gray);}
 }else if(id===12){
  const levels=[f.low,f.mid,f.high],positions=levels.map((e,i)=>[(i-1)*.62,(i%2?1:-1)*e*.48]);line(positions,gray);
  positions.forEach(([x,y],i)=>{const a=.08+levels[i]*.08,b=.14+levels[i]*.28;box(x,y,a,b,white);line([[x-a,y-b],[x-a+.04,y-b-.12],[x+a+.04,y-b-.12],[x+a,y-b]],dim);dot(x,y,levels[i]>.2?red:gray);});
 }else if(id===13){
  for(let i=0;i<15;i++){const x=-.91+i*.13,tilt=.08+f.high*.46,y=Math.sin(i*.55)*f.low*.13;line([[x-.03,y-.25-f.low*.2],[x+tilt*.17,y+.25+f.low*.2]],i%3===0?red:gray);}
 }else if(id===14){
  f.bins.forEach((energy,i)=>{const endX=-.88+i/7*1.76,endY=-.12-energy*.72;line([[0,.82],[endX,endY]],i===0||i===7?dim:gray);dot(endX,endY,energy>.3?red:white,2);});
 }else if(id===15){
  for(let echo=4;echo>=0;echo--){const age=snare.age-echo*.16;if(age<0)continue;const fade=Math.exp(-age*3)/(1+echo*.55),x=(echo-2)*.36,rx=.035+clamp(age*1.5)*.1,ry=.1+clamp(age*2)*.57;ctx.globalAlpha=fade;for(let i=0;i<28;i++){const a=i/28*tau;dot(x+Math.cos(a)*rx,Math.sin(a)*ry,echo===0?red:gray,2,fade);}}
 }else if(id===16){
  for(let row=-1;row<=1;row++){const points=[];for(let i=0;i<50;i++){const s=signal(t-(49-i)*.045),x=-.93+i/49*1.86;points.push([x,row*.25+Math.sin(i*.5+row)*s.amp*.24]);if(i%3===0)dot(x,row*.25+s.amp*.16,i>44?red:gray);}line(points,row===0?white:dim);}
 }else if(id===17){
  for(let c=0;c<42;c++){const s=signal(t-(41-c)*.055),x=-.93+c/41*1.86;[s.low,s.mid,s.high].forEach((e,r)=>{const n=Math.round(e*3);for(let j=0;j<n;j++)dot(x,-.65+r*.65+j*.13,c>38?red:j===0?white:gray);});}
 }else if(id===18){
  for(let ringIndex=6;ringIndex>=0;ringIndex--){const s=signal(t-ringIndex*.12),rx=.14+ringIndex*.11,ry=.08+ringIndex*.105;for(let i=0;i<52;i++){if(i/52>s.amp)continue;const a=i/52*tau-Math.PI/2;dot(Math.cos(a)*rx,Math.sin(a)*ry,ringIndex===0?red:ringIndex<3?white:gray,2,.25+s.amp*.75);}}
 }else if(id===19){
  const age=kick.age,radius=age*.95,fade=Math.exp(-age*2);
  for(let c=0;c<54;c++)for(let r=0;r<10;r++){const x=-.94+c/53*1.88,y=-.85+r/9*1.7,d=Math.hypot(x,y*.5),edge=Math.abs(d-radius);if(edge<.15&&((c^(r*3)^kick.n)%5)<3)dot(x,y,edge<.035?red:gray,2,fade);}
 }
 ctx.restore();
}
function draw(){panels.forEach(p=>{if(p.visible)drawPanel(p,time);});}
function resize(){const dpr=Math.min(devicePixelRatio||1,2);panels.forEach(p=>{p.w=Math.max(1,p.c.getBoundingClientRect().width);p.c.width=Math.round(p.w*dpr);p.c.height=44*dpr;p.ctx.setTransform(dpr,0,0,dpr,0,0);drawPanel(p,time);});}
function schedule(){if(!raf&&!paused&&visible&&!document.hidden&&root.isConnected){last=0;raf=requestAnimationFrame(frame);}}
function frame(now){raf=0;if(!root.isConnected){stopSound();if(context)context.close();return;}if(paused||!visible||document.hidden)return;if(!last)last=now;const dt=now-last;if(dt>=1000/30){time=audible?clock():time+Math.min(dt/1000,.08);last=now;draw();}raf=requestAnimationFrame(frame);}
soundButton.addEventListener('click',()=>audible?stopSound():startSound());
pauseButton.addEventListener('click',()=>{if(!paused)stopSound();paused=!paused;sync();schedule();});
reduced.addEventListener('change',e=>{if(e.matches)stopSound();paused=e.matches;sync();schedule();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSound();else schedule();});
window.addEventListener('pagehide',()=>{stopSound();if(context)context.close();});
new ResizeObserver(resize).observe(container);
const observer=new IntersectionObserver(entries=>{entries.forEach(e=>{const panel=panels.find(p=>p.figure===e.target);if(panel){panel.visible=e.isIntersecting;if(panel.visible)drawPanel(panel,time);}else{visible=e.isIntersecting;if(!visible)stopSound();}});schedule();});
observer.observe(root);panels.forEach(p=>observer.observe(p.figure));
sync();resize();schedule();
})();
</script>
