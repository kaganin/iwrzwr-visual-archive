<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>11 Shared Resources · iwrzwr</title><style>:root{color-scheme:dark;--background:#000;--foreground:#eee;--muted-foreground:#999}*{box-sizing:border-box}body{margin:0;padding:24px;background:#000;color:#eee;font:16px/1.5 Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}.viz-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:24px}.btn{color:#bbb;background:#141414;border:1px solid #333;border-radius:6px;min-height:44px;padding:9px 14px;text-align:left}.btn[aria-pressed=true]{color:#fff;border-color:#ddd;background:#262626}.btn-block{width:100%}.text-small{font-size:14px}.text-muted{color:#999}:focus-visible{outline:2px solid #fff;outline-offset:3px}[hidden]{display:none!important}h3{font-size:18px;font-weight:500}figcaption{font-size:16px}canvas{max-width:100%}@media(max-width:520px){body{padding:16px}}</style><link rel="stylesheet" href="../typography.css"><script src="../motion-runtime.js"></script></head><body><div id="iwr-night-resources" aria-label="Set 11: Shared Resources, beş hareketli ses ekranı">

<style>

  #iwr-night-resources .nr-header { height:126px; position:relative; background:var(--nr-screen); border-radius:0 0 32px 40px; }
  #iwr-night-resources .nr-status { position:absolute; top:24px; left:28px; right:28px; display:flex; align-items:center; justify-content:space-between; font-size:13px; font-weight:500; }

  #iwr-night-resources [hidden] { display:none; }
  #iwr-night-resources .nr-controls { position:absolute; top:62px; left:20px; right:20px; display:flex; align-items:center; gap:24px; height:44px; }
  #iwr-night-resources .nr-circle { width:44px; height:44px; flex:none; display:grid; place-items:center; border-radius:50%; background:#141414; box-shadow:inset 0 0 0 1px #303030; }
  #iwr-night-resources .nr-circle svg { width:20px; height:20px; stroke-width:1.5; }

  @media(max-width:630px) { #iwr-night-resources .nr-layout { grid-template-columns:minmax(0,1fr); gap:18px; } #iwr-night-resources .nr-stage { width:100%; max-width:402px; margin:auto; } }

<script>
(() => {
  const root=document.getElementById('iwr-night-resources');
  const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d');
  const pause=root.querySelector('[data-pause]'),caption=root.querySelector('[data-description]');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const state={style:'choke',mode:'play',paused:reduced.matches,accent:true};
  const names={choke:'Choke Pair',vacancy:'Voice Vacancy',dock:'Docked Phrase',recall:'Masked Recall',routing:'Routed Emphasis'};
  const descriptions={
    choke:['Bir çiftin yeni olayı eski kuyruğu anında kesiyor; diğer çiftler etkilenmiyor.','Yeni iz kısa bir uçla yazılıyor; eşinin devam eden izi aynı anda kesiliyor.'],
    vacancy:['Sekiz sabit yer paylaşılır; hepsi doluysa yalnız en eski etkin iz yerini bırakır.','Olaylar boş yerlere yazılıyor; kapasite dolunca en eski yer yeniden kullanılıyor.'],
    dock:['Birleşmiş parçalar ortak bir gövde; vuruşlar yalnız kendi birleşme çizgisini vurguluyor.','Ayrı parçalar ortak kenarlarda birleşiyor; tamamlanan yapı birlikte hareket ediyor.'],
    recall:['Sahneler değişse de işaretli bölüm aynı kalıyor; diğer parçalar yenileniyor.','Korunan bölüm sabit tutuluyor; yalnız açıkta kalan yollar yeniden yazılıyor.'],
    routing:['Tek giriş, birbirine komşu olmayan hedefleri aynı anda seçiyor; kablo yok.','Aynı girişin hedef kümesi adım adım yazılıyor; yeni üyelik kısa bir çentikle beliriyor.']
  };
  const white='#f1f0e8',amber='#FF0000';
  let w=226,dpr=1,t=2.4,last=0,raf=0,visible=true;
  const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
  // Live sound seam: iwrSignal exists only inside the archive gallery. Without it, or with sound off, nothing changes.
  const hearing=()=>typeof iwrSignal!=='undefined'&&iwrSignal.active?iwrSignal:null;
  // Time-driven machines move on the beat and rest between hits; the studies' own dt clamps still apply first.
  const conduct=()=>{const s=hearing();return s?0.25+4.2*s.hit:1;};
  const mod=(x,n)=>(x%n+n)%n;
  const accent=()=>state.accent?amber:white;
  function ink(alpha=1,color=white) {ctx.globalAlpha=clamp(alpha);ctx.fillStyle=color;ctx.strokeStyle=color;}
  function rect(x,y,width,height,alpha=1,color=white) {ink(alpha,color);ctx.fillRect(Math.round(x*dpr)/dpr,Math.round(y*dpr)/dpr,width,height);}
  function line(points,alpha=1,color=white) {if(points.length<2)return;ink(alpha,color);ctx.lineWidth=1;ctx.lineCap='butt';ctx.lineJoin='miter';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();}
  function partial(points,fraction,alpha,color=white) {
    const lengths=points.slice(1).map((p,i)=>Math.hypot(p[0]-points[i][0],p[1]-points[i][1]));
    let left=lengths.reduce((a,b)=>a+b,0)*clamp(fraction);const path=[points[0]];
    for(let i=0;i<lengths.length&&left>0;i++) {const p=points[i],q=points[i+1],f=Math.min(1,left/lengths[i]);path.push([p[0]+(q[0]-p[0])*f,p[1]+(q[1]-p[1])*f]);left-=lengths[i];}
    line(path,alpha,color);return path[path.length-1];
  }
  // All schedules are deterministic examples, not microphone, MIDI or instrument analysis.
  const chokeEvents=[[.1,0,0],[.38,2,0],[.65,0,1],[.92,1,0],[1.13,3,1],[1.46,2,1],[1.77,1,1],[2.01,0,0],[2.32,3,0],[2.65,0,1],[2.94,2,0],[3.18,3,1],[3.55,1,0],[3.89,1,1],[4.2,2,1],[4.55,0,0]];
  function chokeState(time) {
    const phase=mod(time,6),pairs=Array(4).fill(null),cuts=[];
    chokeEvents.forEach(([at,group,member],id)=>{if(at>phase)return;const old=pairs[group];if(old&&old.end>at&&old.member!==member)cuts.push({at,group,member:old.member});pairs[group]={at,group,member,id,end:at+1.24};});
    return {phase,pairs,cuts};
  }
  function choke(time) {
    const {phase,pairs,cuts}=chokeState(time),pitch=(w-12)/4,recording=state.mode==='record';
    for(let group=0;group<4;group++) {
      const x=6+group*pitch,length=pitch-10;
      for(let member=0;member<2;member++) {const y=member?30:14;line([[x+4,y-3],[x,y-3],[x,y+3],[x+4,y+3]],.24);}
      const event=pairs[group];
      if(event&&event.end>phase) {
        const age=phase-event.at,remaining=clamp((event.end-phase)/1.24),extent=length*Math.ceil(remaining*12)/12*(recording?clamp(age/.12):1),y=event.member?30:14;
        line([[x+3,y],[x+3+extent,y]],.85,age<.12?accent():white);
        if(recording)line([[x+3+extent,y-2],[x+3+extent,y+2]],1,accent());
      }
    }
    cuts.filter(cut=>phase-cut.at<.12).forEach(cut=>{const x=6+cut.group*pitch+6,y=cut.member?30:14;line([[x,y-3],[x,y+3]],1,accent());});
  }
  const starts=[.08,.3,.56,.81,1.05,1.3,1.59,1.89,2.2,2.46,3.2,3.43,4.51];
  const voiceEvents=starts.map((at,id)=>({at,id,duration:2.9+.3*((id*3)%4)}));
  function voiceState(time) {
    const phase=mod(time,8),seats=Array(8).fill(null),actions=[];
    for(const event of voiceEvents) {
      if(event.at>phase)break;
      for(let i=0;i<8;i++)if(seats[i]&&seats[i].end<=event.at)seats[i]=null;
      let seat=seats.findIndex(value=>!value),stolen=null;
      if(seat<0){seat=seats.reduce((oldest,value,i)=>value.at<seats[oldest].at?i:oldest,0);stolen=seats[seat].id;}
      seats[seat]={...event,end:event.at+event.duration};actions.push({at:event.at,seat,stolen,id:event.id});
    }
    for(let i=0;i<8;i++)if(seats[i]&&seats[i].end<=phase)seats[i]=null;
    return {phase,seats,actions};
  }
  function vacancy(time) {
    const {phase,seats,actions}=voiceState(time),pitch=(w-8)/8,width=Math.min(18,pitch-5),recording=state.mode==='record';
    seats.forEach((event,i)=>{
      const x=4+pitch*(i+.5),l=x-width/2,r=x+width/2;
      line([[l+3,11],[l,11],[l,16]],.32);line([[r-3,33],[r,33],[r,28]],.32);
      if(!event)return;
      const age=phase-event.at,remaining=clamp((event.end-phase)/event.duration),direction=event.id%2?1:-1;
      const tooth=[[x-4,22-direction*3],[x+3,22],[x-4,22+direction*3]];
      partial(tooth,recording?clamp(age/.14):1,.9,age<.16?accent():white);
      line([[l,13+(1-remaining)*17],[l+3,13+(1-remaining)*17]],.7);
      if(recording&&age<.2)rect(r-1,8,2,2,1,accent());
    });
    actions.filter(action=>action.stolen!==null&&phase-action.at<.18).forEach(action=>{const x=4+pitch*(action.seat+.5);line([[x-4,38],[x+4,38]],1,accent());});
  }
  const pieces=[[[0,0],[26,0],[26,8],[34,8],[34,22],[0,22]],[[26,0],[60,0],[60,22],[34,22],[34,8],[26,8]],[[60,0],[84,0],[84,10],[92,10],[92,22],[60,22]],[[84,0],[112,0],[112,22],[92,22],[92,10],[84,10]]];
  const seams=[[[26,0],[26,8],[34,8],[34,22]],[[60,0],[60,22]],[[84,0],[84,10],[92,10],[92,22]]];
  function dockGeometry(time,recording) {
    const phase=mod(time,5.2),offsets=pieces.map((_,i)=>{
      if(!recording)return i===3&&phase>3.5?[5*clamp((phase-3.5)/.16),-4*clamp((phase-3.5)/.16)]:[0,0];
      const pending=1-clamp((phase-i*.8)/.14);return [i*7*pending,(i%2?-5:5)*pending*(i?1:0)];
    });
    const common=recording&&phase>2.7?2*clamp((phase-2.7)/.2):0;
    return {phase,offsets,common};
  }
  function dock(time) {
    const recording=state.mode==='record',{phase,offsets,common}=dockGeometry(time,recording),scale=Math.min(1.5,(w-12)/134),left=(w-112*scale)/2-5;
    const map=(p,offset=[0,0])=>[left+(p[0]+offset[0]+common)*scale,10+p[1]+offset[1]];
    const edges=new Map();
    pieces.forEach((points,i)=>{
      for(let j=0;j<points.length;j++) {
        const a=map(points[j],offsets[i]),b=map(points[(j+1)%points.length],offsets[i]);
        const keys=[a.join(','),b.join(',')].sort(),key=keys.join('|');
        const previous=edges.get(key);edges.set(key,{a,b,count:previous?previous.count+1:1});
      }
    });
    edges.forEach(edge=>line([edge.a,edge.b],edge.count>1?.22:.75));
    const active=Math.min(2,Math.floor(phase/.8));
    if(!recording&&phase<3.2){const points=seams[active].map(p=>map(p));partial(points,clamp(mod(phase,.8)/.15),.9,accent());}
    if(recording)seams.forEach((points,i)=>{const age=phase-(i+1)*.8;if(age>=0&&age<.26)line(points.map(p=>map(p)),1,accent());});
  }
  const routes=[[0,8,-5],[8,-6,4],[-6,5,9],[4,-9,-3],[9,2,-8],[-3,7,3]];
  function recallState(time) {
    // Twelve complete scenes; seed is the previous cycle's terminal state.
    const phase=mod(time,9.6),event=Math.min(11,Math.floor((phase+1e-10)/.8)),values=[-3,7,4];let protectedIndex=0;
    for(let scene=0;scene<=event;scene++) {protectedIndex=Math.floor(scene/4)%3;for(let i=0;i<3;i++)if(i!==protectedIndex)values[i]=routes[scene%routes.length][i];}
    return {event,values,protectedIndex,age:Math.max(0,phase-event*.8)};
  }
  function recall(time) {
    const {event,values,protectedIndex,age}=recallState(time),span=(w-14)/3,recording=state.mode==='record';
    values.forEach((value,i)=>{
      const x=7+i*span,y=22-value,points=[[x,22],[x+span*.2,22],[x+span*.2,y],[x+span*.68,y],[x+span*.68,22],[x+span,22]];
      const locked=i===protectedIndex;
      partial(points,recording&&!locked?clamp(age/.16):1,locked?1:.65);
      if(locked) {
        line([[x+4,35],[x+4,38],[x+span-4,38],[x+span-4,35]],.72,accent());
        rect(x-1,21,2,2,1,accent());rect(x+span-1,21,2,2,1,accent());
      } else if(recording&&age<.16)rect(x+span*.2-1,y-1,2,2,1,accent());
    });
    if(event%4===0&&age<.12){const x=7+protectedIndex*span+span/2;line([[x-2,40],[x+2,40]],.85,accent());}
  }
  const routeMasks=[1,5,37,2,6,22];
  function routing(time) {
    const recording=state.mode==='record',step=Math.floor(time/.76),age=mod(time,.76),source=recording?Math.floor(step/3)%2:step%2,mask=recording?routeMasks[step%6]:(source?22:37);
    const previous=recording&&step%3?routeMasks[(step-1)%6]:0,hold=age<.42,alpha=hold?1:.45;
    for(let i=0;i<2;i++){const y=i?32:12;line([[4,y-4],[4,y+4],[10,y+4]],i===source?alpha:.17,i===source?accent():white);}
    for(let i=0;i<6;i++) {
      const x=30+(w-41)*(i%3)/2,y=i<3?12:32,selected=Boolean(mask&(1<<i)),newMember=selected&&!(previous&(1<<i));
      const a=selected?alpha:.17;
      line([[x-4,y-3],[x+4,y-3]],a);line([[x-4,y+3],[x+4,y+3]],a);
      if(selected)line([[x,y-3],[x,y+3]],a,accent());
      if(recording&&newMember&&age<.2)line([[x+6,y-2],[x+6,y+2]],1,accent());
    }
  }
  const renderers={choke,vacancy,dock,recall,routing};
  function draw() {ctx.clearRect(0,0,w,44);ctx.save();ctx.beginPath();ctx.rect(0,0,w,44);ctx.clip();renderers[state.style](t);ctx.restore();}
  function sync() {
    root.querySelectorAll('[data-style]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.style===state.style)));
    root.querySelectorAll('[data-mode]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.mode===state.mode)));
    const description=descriptions[state.style][state.mode==='record'?1:0];caption.textContent=description;canvas.setAttribute('aria-label',names[state.style]+': '+description);
    root.querySelector('[data-record]').hidden=state.mode!=='record';pause.textContent=state.paused?'Devam et':'Duraklat';pause.setAttribute('aria-pressed',String(state.paused));draw();schedule();
  }
  function resize(){w=Math.max(1,canvas.getBoundingClientRect().width);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=44*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
  function schedule(){if(!raf&&!state.paused&&visible&&!document.hidden&&root.isConnected){last=0;raf=requestAnimationFrame(frame);}}
  function frame(now){raf=0;if(state.paused||!visible||document.hidden||!root.isConnected)return;if(!last)last=now;const elapsed=now-last;if(elapsed>=1000/30){t+=Math.min(elapsed/1000,.07)*conduct();last=now;draw();}raf=requestAnimationFrame(frame);}
  root.querySelectorAll('[data-style]').forEach(el=>el.addEventListener('click',()=>{state.style=el.dataset.style;sync();}));
  root.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>{state.mode=el.dataset.mode;sync();}));
  pause.addEventListener('click',()=>{state.paused=!state.paused;sync();});reduced.addEventListener('change',()=>{state.paused=reduced.matches;sync();});
  document.addEventListener('visibilitychange',schedule);new ResizeObserver(resize).observe(canvas);
  new IntersectionObserver(entries=>{const latest=entries.reduce((a,b)=>b.target===root&&(!a||b.time>=a.time)?b:a,null);if(latest){visible=latest.isIntersecting;schedule();}}).observe(root);
  resize();sync();
  if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.nr-phone'),onChange:sync});tweak.addToggle(state,'accent',{label:'Kehribar vurgu'});}
})();
</script>
