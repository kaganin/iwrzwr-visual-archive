<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sound Machines · iwrzwr</title><style>:root{color-scheme:dark;--background:#000;--foreground:#eee;--muted-foreground:#999}*{box-sizing:border-box}body{margin:0;padding:24px;background:#000;color:#eee;font:16px/1.5 Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}.viz-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:24px}.btn{color:#bbb;background:#141414;border:1px solid #333;border-radius:6px;min-height:44px;padding:9px 14px;text-align:left}.btn[aria-pressed=true]{color:#fff;border-color:#ddd;background:#262626}.btn-block{width:100%}.text-small{font-size:14px}.text-muted{color:#999}:focus-visible{outline:2px solid #fff;outline-offset:3px}[hidden]{display:none!important}h3{font-size:18px;font-weight:500}figcaption{font-size:16px}canvas{max-width:100%}@media(max-width:520px){body{padding:16px}}</style><link rel="stylesheet" href="../typography.css"><script src="../motion-runtime.js"></script></head><body><div id="iwr-sound-machines" aria-label="Araştırmadan esinlenen beş ses makinesi önizlemesi">
  <div class="viz-controls">
    <button type="button" class="btn" data-mode="play" aria-pressed="true">Çalma</button>
    <button type="button" class="btn" data-mode="record" aria-pressed="false">Kayıt</button>
    <button type="button" class="btn btn-ghost" data-pause aria-pressed="false">Duraklat</button>
    <span class="text-small text-muted">Simüle ses ritmi · tasarım çalışması</span>
  </div>
  <div class="sm-layout">
    <div class="sm-stage">
      <div class="sm-phone" aria-label="iwrzwr deneysel ses ekranı">
        <div class="sm-header">
          <div class="sm-status" aria-hidden="true"><span>9:41</span><span>••• &nbsp; ▰</span></div>
          <div class="sm-controls">
            <div class="sm-circle" aria-hidden="true"></div>
            <div class="sm-activity">
              <div class="sm-record" hidden><span class="sm-dot"></span><span data-clock>00:00</span></div>
              <canvas role="img" aria-label="Harmonic Motor: dönen kollar dalgayı çiziyor"></canvas>
            </div>
            <div class="sm-circle" aria-hidden="true"></div>
          </div>
        </div>
        <div class="sm-pads" aria-hidden="true"><div><i data-lucide="mic"></i></div><div><i data-lucide="mic"></i></div></div>
      </div>
      <div class="text-small text-muted sm-spec">44px alan · 24px boşluk · 1px vektör çizgileri</div>
    </div>
    <div class="sm-options" role="group" aria-label="Beş ses makinesi">
      <button type="button" class="btn btn-block" data-style="sand" aria-pressed="false">1 · Resonance Sand</button>
      <button type="button" class="btn btn-block" data-style="motor" aria-pressed="true">2 · Harmonic Motor</button>
      <button type="button" class="btn btn-block" data-style="spring" aria-pressed="false">3 · Spring Rail</button>
      <button type="button" class="btn btn-block" data-style="pendulum" aria-pressed="false">4 · Pendulum Choir</button>
      <button type="button" class="btn btn-block" data-style="grains" aria-pressed="false">5 · Grain Conveyor</button>
    </div>
  </div>
  <div class="sm-caption" data-description aria-live="polite">Birbirine bağlı döner kolların ucu ses dalgasını çiziyor; küçük bir harmonik motor.</div>
</div>
<style>
  #iwr-sound-machines .sm-layout { display:grid; grid-template-columns:minmax(0,402px) minmax(150px,1fr); gap:24px; align-items:center; margin-top:20px; }
  #iwr-sound-machines .sm-stage { min-width:0; }
  #iwr-sound-machines .sm-options { display:grid; gap:8px; }
  #iwr-sound-machines .sm-phone { width:100%; background:#cdcdcd; color:#fff; font-family:-apple-system,BlinkMacSystemFont,sans-serif; border-radius:30px; overflow:hidden; }
  #iwr-sound-machines .sm-header { height:126px; position:relative; background:#000; border-radius:0 0 32px 40px; }
  #iwr-sound-machines .sm-status { position:absolute; top:24px; left:28px; right:28px; display:flex; justify-content:space-between; font-size:13px; line-height:16px; font-weight:500; }
  #iwr-sound-machines .sm-controls { position:absolute; top:62px; left:20px; right:20px; display:flex; align-items:center; gap:24px; height:44px; }
  #iwr-sound-machines .sm-circle { flex:none; width:44px; height:44px; border-radius:50%; background:#141414; box-shadow:inset 0 0 0 1px #303030; }
  #iwr-sound-machines .sm-activity { display:flex; flex:1; min-width:0; height:44px; gap:8px; align-items:center; }
  #iwr-sound-machines canvas { display:block; flex:1; min-width:0; width:100%; height:44px; }
  #iwr-sound-machines .sm-record { display:flex; flex:none; width:60px; align-items:center; gap:6px; color:#fff; font-family:ui-monospace,monospace; font-size:11px; line-height:14px; font-variant-numeric:tabular-nums; }
  #iwr-sound-machines .sm-record[hidden] { display:none; }
  #iwr-sound-machines .sm-dot { width:6px; height:6px; border-radius:50%; flex:none; background:#ff413a; }
  #iwr-sound-machines .sm-pads { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:#b4b4b4; }
  #iwr-sound-machines .sm-pads>div { display:grid; place-items:center; height:120px; background:#cdcdcd; color:#909090; }
  #iwr-sound-machines .sm-pads svg { width:18px; height:18px; }
  #iwr-sound-machines .sm-spec { margin-top:10px; }
  #iwr-sound-machines .sm-caption { margin-top:18px; min-height:44px; }
  @media(max-width:610px) { #iwr-sound-machines .sm-layout { grid-template-columns:minmax(0,1fr); gap:18px; } #iwr-sound-machines .sm-stage { width:100%; max-width:402px; margin:auto; } #iwr-sound-machines .sm-options { grid-template-columns:repeat(2,minmax(0,1fr)); } }
</style>
<script>
(() => {
  const root=document.getElementById('iwr-sound-machines');
  const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d');
  const record=root.querySelector('.sm-record'),clock=root.querySelector('[data-clock]');
  const caption=root.querySelector('[data-description]'),pause=root.querySelector('[data-pause]');
  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const state={style:'motor',mode:'play',paused:false,accent:true,gain:0.8};
  const descriptions={
    sand:'Titreşimle yeniden şekillenen kum desenleri; Chladni plakalarından esinlenen küçük rezonans yüzeyleri.',
    motor:'Birbirine bağlı döner kolların ucu ses dalgasını çiziyor; küçük bir harmonik motor.',
    spring:'Ses darbesi yayları sıkıştırıp kütleleri hareket ettiriyor; mekanik ve hafif oyuncak hissinde.',
    pendulum:'Farklı hızdaki sarkaçlar açılıp birleşiyor; dalga, parçaların birlikte hareketinden oluşuyor.',
    grains:'Küçük ses parçaları okuma kafasından geçiyor; aktif parça turuncuyla beliriyor.'
  };
  const names={sand:'Resonance Sand',motor:'Harmonic Motor',spring:'Spring Rail',pendulum:'Pendulum Choir',grains:'Grain Conveyor'};
  const white='#eeeeeb',orange='#FF0000';
  let w=226,h=44,dpr=2,time=2.1,last=0,level=0.55,recordTime=0,visible=true;
  // Live sound seam: iwrSignal exists only inside the archive gallery. Without it, or with sound off, nothing changes.
  const live=()=>typeof iwrSignal!=='undefined'&&iwrSignal.active?iwrSignal:null;
  const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
  const mod=(a,b)=>((a%b)+b)%b;
  function envelope(t){return 0.14+0.55*Math.pow(Math.sin(t*1.65),4)+0.25*Math.pow(Math.sin(t*3.15+0.7),8);}
  function accent(){return state.accent?orange:white;}
  function ink(alpha=1,color=white){ctx.globalAlpha=clamp(alpha);ctx.strokeStyle=color;ctx.fillStyle=color;}
  function line(points,alpha=1,color=white,width=1){
    if(!points.length)return;
    ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    ink(alpha,color);ctx.lineWidth=width;ctx.lineCap='butt';ctx.lineJoin='miter';ctx.stroke();ctx.globalAlpha=1;
  }
  function circle(x,y,r,alpha=1,color=white,filled=false){
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ink(alpha,color);ctx.lineWidth=1;
    filled?ctx.fill():ctx.stroke();ctx.globalAlpha=1;
  }
  function point(x,y,size=1,alpha=1,color=white){
    ink(alpha,color);ctx.fillRect(Math.round(x*dpr)/dpr,Math.round(y*dpr)/dpr,size,size);ctx.globalAlpha=1;
  }
  // Modal-field study, not a calibrated simulation of a metal plate.
  function sand(t,gain){
    const n=Math.max(1,Math.min(4,Math.floor(w/43)));
    const side=Math.min(36,(w-(n-1)*12)/n),total=n*side+(n-1)*12,left=(w-total)/2;
    const modes=[[2,0],[2,4],[4,0],[4,6]];
    const active=mod(Math.floor(t/1.8),n);
    for(let panel=0;panel<n;panel++){
      const x0=left+panel*(side+12),y0=(44-side)/2;
      const [m,note]=modes[panel];
      const phase=t*0.9+panel*1.3;
      const balance=1+0.55*Math.sin(phase)+gain*0.08;
      const driftX=0.055*Math.sin(phase),driftY=0.055*Math.cos(phase*0.8);
      const cells=37,pitch=side/cells;
      for(let y=0;y<cells;y++)for(let x=0;x<cells;x++){
        const u=(x+0.5)/cells+driftX,v=(y+0.5)/cells+driftY;
        const f1=Math.cos(m*Math.PI*u)*Math.cos(note*Math.PI*v);
        const f2=Math.cos(note*Math.PI*u)*Math.cos(m*Math.PI*v);
        const distance=Math.abs(f1+balance*f2);
        const strength=Math.exp(-Math.pow(distance/(0.10+gain*0.04),2));
        if(strength<0.11)continue;
        const vibration=(0.25+gain*0.65);
        const jitterX=Math.sin(t*6+x*0.7+y*0.3+panel)*vibration;
        const jitterY=Math.cos(t*5+y*0.6-x*0.4+panel)*vibration;
        point(x0+clamp(x*pitch+jitterX,0,side-0.8),y0+clamp(y*pitch+jitterY,0,side-0.8),0.8,(0.25+0.75*strength)*(0.7+gain*0.3));
      }
      line([[x0,y0+3],[x0,y0],[x0+3,y0]],0.32,panel===active?accent():white,0.7);
      line([[x0+side-3,y0+side],[x0+side,y0+side],[x0+side,y0+side-3]],0.32,panel===active?accent():white,0.7);
    }
  }
  function motorComponents(phase,gain){
    const scale=0.64+gain*0.36;
    return [{r:11.5*scale,a:phase},{r:4.2*scale,a:-phase*3+0.4},{r:2.1*scale,a:phase*5+0.9}];
  }
  function motorY(phase,gain){return 22+motorComponents(phase,gain).reduce((sum,c)=>sum+c.r*Math.sin(c.a),0);}
  function motor(t,gain){
    const phase=t*(state.mode==='record'?1.85:1.5),compact=w<72,cx=compact?w/2:20,start=49;
    let x=cx,y=22;
    circle(cx,22,1.5,0.8,white,true);
    for(const [i,c] of motorComponents(phase,gain).entries()){
      circle(x,y,c.r,i===0?0.35:0.28);
      const nextX=x+c.r*Math.cos(c.a),nextY=y+c.r*Math.sin(c.a);
      line([[x,y],[nextX,nextY]],0.88,i===2?accent():white);
      x=nextX;y=nextY;
    }
    circle(x,y,1.65,1,accent(),true);
    if(compact)return;
    line([[x,y],[start,y]],0.42,accent(),0.7);
    line([[start,4],[start,40]],0.10,white,0.7);
    const length=Math.max(10,w-start-2),points=[];
    for(let i=0;i<=130;i++)points.push([start+i/130*length,motorY(phase-i/130*6.2,gain)]);
    line(points,0.90);
  }
  function spring(t,gain){
    const count=Math.max(2,Math.min(7,Math.floor(w/29))),pitch=(w-16)/(count+1),nodes=[];
    const drift=t*(state.mode==='record'?3.4:2.5);
    for(let i=0;i<count;i++){
      const x=8+(i+1)*pitch+Math.sin(drift-i*0.72)*pitch*(0.05+gain*0.20);
      nodes.push([x,22+Math.sin(drift-i*0.72)*gain*1.4]);
    }
    const chain=[[4,22],...nodes,[w-4,22]];
    for(let i=0;i<chain.length-1;i++){
      const a=chain[i],b=chain[i+1],inset=Math.min(3,(b[0]-a[0])*0.2),points=[[a[0]+inset,a[1]]];
      const length=b[0]-a[0]-inset*2,turns=length<12?4:8,height=Math.min(3.7,length*0.32);
      for(let k=0;k<=turns;k++){
        const u=k/turns;
        points.push([a[0]+inset+u*length,a[1]+u*(b[1]-a[1])+(k===0||k===turns?0:k%2?height:-height)]);
      }
      points.push([b[0]-inset,b[1]]);line(points,0.58,white,0.8);
    }
    line([[3,12],[3,32]],0.65);line([[w-3,12],[w-3,32]],0.65);
    const active=mod(Math.floor(t*1.6),count);
    nodes.forEach((p,i)=>{
      ink(1,'#000');ctx.fillRect(p[0]-3,p[1]-4,6,8);
      ink(i===active?0.95:0.8,i===active?accent():white);ctx.lineWidth=1;ctx.strokeRect(p[0]-2.5,p[1]-3.5,5,7);
      line([[8+(i+1)*pitch,36],[8+(i+1)*pitch,38]],0.18,white,0.7);
    });ctx.globalAlpha=1;
  }
  function pendulum(t,gain){
    const count=Math.max(4,Math.min(11,Math.floor(w/19))),left=10,pitch=(w-20)/(count-1);
    line([[left,5],[w-left,5]],0.35,white,0.7);
    const baseFrequency=state.mode==='record'?2.5:2;
    for(let i=0;i<count;i++){
      const x=left+i*pitch,L=32-i/(count-1)*9;
      const phase=(t+8)*baseFrequency*Math.sqrt(32/L);
      const angle=(3+gain*5)/L*Math.cos(phase);
      const bobX=x+L*Math.sin(angle),bobY=6+L*Math.cos(angle);
      const current=i===Math.floor(count/2);
      point(x-0.5,4.5,1,0.5);
      line([[x,6],[bobX,bobY]],0.43,white,0.7);
      circle(bobX,bobY,current?2:1.6,0.92,current?accent():white,true);
    }
  }
  function grains(t,gain){
    const speed=state.mode==='record'?22:16,travel=t*speed,spacing=35,head=w*0.53;
    for(let x=1-mod(travel,9);x<w;x+=9){point(x,3,1.25,0.18);point(x,39,1.25,0.18);}
    line([[1,22],[w-1,22]],0.09,white,0.7);
    const baseIndex=Math.floor(travel/spacing);
    for(let i=-1;i<=Math.ceil(w/spacing)+1;i++){
      const index=i+baseIndex,start=i*spacing-mod(travel,spacing),length=22+3*Math.sin(index*7.1);
      if(start+length<0||start>w)continue;
      const active=head>=start&&head<=start+length;
      const y=22+Math.sin(index*4.6)*3;
      const height=4+envelope(index*0.39)*9*(0.6+gain*0.4);
      const points=[];
      for(let p=0;p<=38;p++){
        const u=p/38;
        const v=Math.sin(u*Math.PI)*Math.sin(u*Math.PI*(5+mod(index,3)))*height;
        points.push([start+u*length,y+v]);
      }
      line(points,active?1:0.52,active?accent():white,1);
      line([[start,y-2],[start,y+2]],0.20,white,0.7);
    }
    line([[head-3,6],[head,6],[head,36],[head+3,36]],0.8,accent(),0.8);
  }
  const renderers={sand,motor,spring,pendulum,grains};
  function draw(){
    ctx.clearRect(0,0,w,h);ctx.save();ctx.beginPath();ctx.rect(0,0,w,h);ctx.clip();
    const t=reduced.matches?2.1:time,gain=reduced.matches?0.42+level*0.1:level;
    renderers[state.style](t,gain);ctx.restore();
  }
  function resize(){
    w=Math.max(1,canvas.getBoundingClientRect().width);dpr=Math.min(devicePixelRatio||1,3);
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();
  }
  function sync(){
    root.querySelectorAll('[data-style]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.style===state.style)));
    root.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));
    record.hidden=state.mode!=='record';
    const seconds=Math.floor(recordTime);
    clock.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
    pause.textContent=state.paused?'Devam et':'Duraklat';pause.setAttribute('aria-pressed',String(state.paused));
    caption.textContent=descriptions[state.style];canvas.setAttribute('aria-label',names[state.style]+': '+descriptions[state.style]);resize();
  }
  root.querySelectorAll('[data-style]').forEach(b=>b.addEventListener('click',()=>{state.style=b.dataset.style;sync();}));
  root.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.mode;recordTime=0;sync();}));
  pause.addEventListener('click',()=>{state.paused=!state.paused;sync();});
  const visibility=new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;});visibility.observe(root);
  const observer=new ResizeObserver(resize);observer.observe(canvas);
  function frame(now){
    if(!root.isConnected){visibility.disconnect();observer.disconnect();return;}
    const dt=last?Math.min((now-last)/1000,0.05):0;last=now;
    if(!state.paused&&!document.hidden&&visible){
      time+=dt;recordTime+=dt;
      const heardNow=live();
      const target=clamp((heardNow?0.13+0.87*Math.max(heardNow.level,heardNow.hit):envelope(time))*state.gain/0.8);
      level+=(target-level)*(1-Math.exp(-dt/(target>level?0.08:0.24)));
      draw();const n=Math.floor(recordTime);
      clock.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
    }
    requestAnimationFrame(frame);
  }
  sync();requestAnimationFrame(frame);
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root.querySelector('.sm-phone'),onChange:sync});
    tweak.addToggle(state,'accent',{label:'Aktif parçayı turuncu göster'});
    tweak.addSlider(state,'gain',{label:'Ses yoğunluğu',min:0.2,max:1,step:0.05});
  }
})();
</script>
<script src="../isolate.js"></script></body></html>
