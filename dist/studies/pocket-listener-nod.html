#pocket-listener-nod .listener-reference { position:absolute; inset:0; display:block; width:100%; height:100%; }
#pocket-listener-nod .listener-footer { background:#000; color:#f5f5f5; padding:8px 22px 22px; }
#pocket-listener-nod .listener-controls { display:flex; gap:10px; flex-wrap:wrap; }
#pocket-listener-nod button { font:inherit; font-size:13px; font-weight:400; line-height:1.35; color:#eee; background:transparent; border:1px solid #454545; border-radius:24px; min-height:44px; padding:10px 20px; cursor:pointer; transition:background-color 160ms ease,border-color 160ms ease; }
#pocket-listener-nod button[data-action="play"] { background:#f5f5f5; color:#080808; border-color:#f5f5f5; min-width:122px; }
#pocket-listener-nod button:disabled { opacity:.5; cursor:wait; }
#pocket-listener-nod button:focus-visible { outline:2px solid #FF0000; outline-offset:4px; }
#pocket-listener-nod .listener-caption { display:block; margin-top:13px; font-size:12px; line-height:1.4; color:#a6a6a6; overflow-wrap:anywhere; }
@media (hover:hover) and (pointer:fine) { #pocket-listener-nod button[data-action="track"]:hover { background:#181818; border-color:#999; } }
@media (prefers-reduced-motion:reduce) { #pocket-listener-nod button { transition:none; } }
</style>
<script>
(() => {
  const root = document.getElementById('pocket-listener-nod');
  const canvas = root.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const reference = root.querySelector('.listener-reference');
  const playButton = root.querySelector('[data-action="play"]');
  const trackButton = root.querySelector('[data-action="track"]');
  const fileInput = root.querySelector('input');
  const caption = root.querySelector('.listener-caption');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const TAU = Math.PI * 2;
  const BPM = 92;
  const beatLength = 60 / BPM;
  const settings = { depth: 1, shoulder: 1 };
  let scale = 1;
  let context, master, analyser, frequencies, waveform, buffer, source;
  let playing = false, busy = false, customTrack = false;
  let startedAt = 0, pausedAt = 0, lastClock = 0, lastTime = performance.now();
  let nextBeat = 0, frameId = 0, lastOnset = -1, bassAverage = 0, bassLevel = 0;
  let angle = 0, angularVelocity = 0, shoulder = 0, shoulderVelocity = 0, glow = 0;
  let pendingShoulder = [], ripples = [], audioRms = 0, audioName = '';
  let lastDrawn = -1;

  // Use the accepted trace verbatim. A continuous neck rig transforms its
  // control points, keeping every joint and both edges of each contour together.
  const contours = [...reference.querySelectorAll('path')].slice(1).map(path => {
    const translate = path.getAttribute('transform').match(/[-\d.]+/g).map(Number);
    const tokens = path.getAttribute('d').match(/[MCZ]|-?(?:\d*\.)?\d+(?:e[-+]?\d+)?/gi);
    const commands = [];
    let i = 0;
    while (i < tokens.length) {
      const command = tokens[i++];
      const count = command === 'M' ? 2 : command === 'C' ? 6 : 0;
      const values = [];
      for (let j = 0; j < count; j += 2) {
        values.push(Number(tokens[i++]) + translate[0], Number(tokens[i++]) + translate[1]);
      }
      commands.push({ command, values });
    }
    return { fill: path.getAttribute('fill'), commands };
  });

  const clamp = (x, min=0, max=1) => Math.max(min, Math.min(max,x));
  const smooth = x => { x=clamp(x); return x*x*(3-2*x); };

  function point(x, y) {
    const headWeight = 1-smooth((y-415)/310);
    const bodyWeight = 1-smooth((y-520)/310);
    const a = angle * Math.PI/180 * headWeight * settings.depth;
    const c = Math.cos(a), s = Math.sin(a);
    const dx = x-438, dy=y-475;
    return [
      438 + dx*c-dy*s + shoulder*bodyWeight*.34*settings.shoulder,
      475 + dx*s+dy*c + shoulder*bodyWeight*settings.shoulder
    ];
  }

  function earTransform() {
    const p=point(337.7,292.5);
    ctx.translate(p[0],p[1]);
    ctx.rotate(angle*Math.PI/180*settings.depth);
  }

  function draw(time) {
    ctx.setTransform(scale,0,0,scale,0,0);
    ctx.fillStyle='#000';
    ctx.fillRect(0,0,820,852);

    ctx.save();
    earTransform();
    for(const pulse of ripples) {
      const age=(time-pulse.time)/.68;
      if(age<0 || age>1) continue;
      const radius=25+age*70;
      ctx.globalAlpha=(1-age)*(1-age)*pulse.strength*.65;
      ctx.strokeStyle='#FF0000';
      ctx.lineWidth=2;
      ctx.lineCap='round';
      ctx.beginPath();
      ctx.arc(0,0,radius,2.22,4.03);
      ctx.stroke();
    }
    ctx.restore();

    for(const contour of contours) {
      ctx.beginPath();
      for(const part of contour.commands) {
        const v=part.values;
        if(part.command==='M') { const p=point(v[0],v[1]); ctx.moveTo(p[0],p[1]); }
        else if(part.command==='C') {
          const a=point(v[0],v[1]), b=point(v[2],v[3]), c=point(v[4],v[5]);
          ctx.bezierCurveTo(a[0],a[1],b[0],b[1],c[0],c[1]);
        } else ctx.closePath();
      }
      ctx.fillStyle=contour.fill;
      ctx.fill();
    }

    // The earbud is the only accent. No new facial features or outlines.
    if(glow>.005) {
      ctx.save();
      earTransform();
      ctx.globalAlpha=glow*.8;
      ctx.fillStyle='#FF0000';
      ctx.beginPath();
      ctx.arc(0,0,10.5,0,TAU);
      ctx.fill();
      ctx.restore();
    }
  }

  function resize() {
    const width=canvas.getBoundingClientRect().width;
    const dpr=Math.min(devicePixelRatio || 1,3);
    canvas.width=Math.round(width*dpr);
    canvas.height=Math.round(width*852/820*dpr);
    scale=canvas.width/820;
    draw(lastClock);
  }

  function createAudio() {
    const Audio=window.AudioContext || window.webkitAudioContext;
    if(!Audio) throw new Error('Audio is not supported in this browser.');
    context=new Audio({latencyHint:'interactive'});
    master=context.createGain();
    master.gain.value=.38;
    analyser=context.createAnalyser();
    analyser.fftSize=1024;
    analyser.smoothingTimeConstant=.25;
    frequencies=new Uint8Array(analyser.frequencyBinCount);
    waveform=new Float32Array(analyser.fftSize);
    analyser.connect(master);
    master.connect(context.destination);
  }

  // A small original instrumental: swung hats, soft snare, warm sub,
  // electric-piano chords. Rendered locally; no downloads or microphone.
  function makeGroove() {
    const sr=context.sampleRate, duration=32*beatLength;
    const length=Math.round(duration*sr);
    const result=context.createBuffer(2,length,sr);
    const left=result.getChannelData(0), right=result.getChannelData(1);
    let seed=87354;
    const noise=()=> { seed ^= seed<<13; seed ^= seed>>>17; seed ^= seed<<5; return (seed>>>0)/2147483648-1; };
    const mix=(at,duration,voice,pan=0,echo=0)=>{
      const start=Math.round(at*sr), n=Math.ceil(duration*sr);
      const l=Math.sqrt((1-pan)*.5), r=Math.sqrt((1+pan)*.5);
      for(let i=0;i<n;i++) {
        const value=voice(i/sr,i);
        const index=(start+i)%length;
        left[index]+=value*l; right[index]+=value*r;
        if(echo) {
          const delayed=(index+Math.round(beatLength*.75*sr))%length;
          left[delayed]+=value*echo*r; right[delayed]+=value*echo*l;
        }
      }
    };
    const midi=n=>440*Math.pow(2,(n-69)/12);
    const kick=(at,velocity=1)=>mix(at,.6,t=>{
      const pitchPhase=TAU*(46*t+60*.029*(1-Math.exp(-t/.029)));
      return velocity*(Math.sin(pitchPhase)*Math.exp(-t*10)*.9+
        noise()*Math.exp(-t*200)*.035)*(1-Math.exp(-t*1000));
    });
    const snare=(at,velocity=1)=>{
      let previous=0;
      mix(at,.25,t=>{
        const n=noise(), high=n-previous*.78; previous=n;
        return velocity*(high*Math.exp(-t*24)*.2+Math.sin(TAU*185*t)*Math.exp(-t*30)*.1)*(1-Math.exp(-t*1600));
      },.1);
    };
    const hat=(at,velocity=.5,open=false)=>{
      let previous=0;
      mix(at,open?.22:.075,t=>{
        const n=noise(), high=n-previous; previous=n;
        return high*Math.exp(-t*(open?23:75))*.05*velocity*(1-Math.exp(-t*2500));
      },-.3);
    };
    const bass=(at,note,duration,velocity=1)=>{
      const f=midi(note);
      mix(at,duration,t=>{
        const envelope=(1-Math.exp(-t*130))*Math.exp(-t*3)*Math.min(1,(duration-t)*30);
        return (Math.sin(TAU*f*t)*.31+Math.sin(TAU*f*t*2)*.035)*envelope*velocity;
      },-.06);
    };
    const chords=[[53,57,60,64],[53,57,60,62],[50,53,57,60],[52,55,58,62]];
    const roots=[38,38,34,36];
    for(let bar=0;bar<8;bar++) {
      const base=bar*4*beatLength;
      kick(base);
      kick(base+2*beatLength,.88);
      kick(base+(bar%2?3.5:2.75)*beatLength,.62);
      snare(base+beatLength);
      snare(base+3*beatLength,.9);
      if(bar%2) snare(base+3.75*beatLength,.18);
      for(let h=0;h<8;h++) hat(base+(h*.5+(h%2?.055:0))*beatLength,h%2?.48:.8,h===7);
      const root=roots[bar%4];
      bass(base,root,beatLength*.82);
      bass(base+1.5*beatLength,root+12,beatLength*.34,.65);
      bass(base+2*beatLength,root,beatLength*.7,.85);
      bass(base+3.35*beatLength,root+7,beatLength*.5,.65);
      for(const hit of [0,2.5]) {
        chords[bar%4].forEach((note,k)=>{
          const f=midi(note), at=base+hit*beatLength+k*.009;
          mix(at,1.45,t=>{
            const env=(1-Math.exp(-t*80))*Math.exp(-t*3.8)*Math.min(1,(1.45-t)*20);
            return Math.sin(TAU*f*t+.55*Math.sin(TAU*2*f*t)*Math.exp(-t*6))*env*.045;
          },(k-1.5)*.28,.19);
        });
      }
    }
    let peak=0;
    for(let i=0;i<length;i++) peak=Math.max(peak,Math.abs(left[i]),Math.abs(right[i]));
    const gain=.87/Math.max(peak,.87);
    for(let i=0;i<length;i++) { left[i]*=gain; right[i]*=gain; }
    return result;
  }

  function audibleTime() {
    let clock=context.currentTime;
    if(context.getOutputTimestamp) {
      const timestamp=context.getOutputTimestamp();
      if(timestamp.contextTime>0 && timestamp.performanceTime>0) {
        clock=timestamp.contextTime+(performance.now()-timestamp.performanceTime)/1000;
      }
    } else clock-=context.baseLatency || 0;
    return Math.max(0,clock-startedAt);
  }

  function impulse(strength,time) {
    if(time-lastOnset<.19) return;
    lastOnset=time;
    if(!reduced.matches) {
      angularVelocity+=96*strength;
      pendingShoulder.push({time:time+.075,strength});
      ripples.push({time,strength});
    }
    glow=Math.max(glow,Math.min(1,strength));
  }

  async function start() {
    if(busy || playing) return;
    busy=true;
    playButton.disabled=true;
    try {
      if(!context) createAudio();
      await context.resume();
      if(!buffer) buffer=makeGroove();
      source=context.createBufferSource();
      source.buffer=buffer;
      source.loop=!customTrack;
      source.connect(analyser);
      startedAt=context.currentTime+.025-pausedAt;
      source.start(context.currentTime+.025,pausedAt % buffer.duration);
      const activeSource=source;
      source.onended=()=>{
        if(playing && customTrack && activeSource===source) {
          playing=false; pausedAt=0; pendingShoulder=[]; playButton.textContent='Replay';
          caption.textContent=audioName; root.dataset.playing='false';
        }
      };
      nextBeat=Math.ceil(pausedAt/beatLength);
      lastOnset=pausedAt-.2;
      bassAverage=0;
      bassLevel=0;
      playing=true;
      root.dataset.playing='true';
      playButton.textContent='Pause';
      caption.textContent=customTrack?audioName:'Original groove · 92 BPM';
    } catch(error) {
      playing=false;
      caption.textContent=error.message || 'Audio could not start. Please try again.';
    } finally {
      busy=false; playButton.disabled=false;
    }
  }

  function pause() {
    if(!playing) return;
    pausedAt=audibleTime();
    playing=false;
    source.onended=null;
    source.stop();
    source.disconnect();
    source=null;
    pendingShoulder=[];
    root.dataset.playing='false';
    playButton.textContent='Resume';
    caption.textContent=customTrack?audioName:'Original groove · 92 BPM';
  }

  function audioLevels() {
    analyser.getByteFrequencyData(frequencies);
    analyser.getFloatTimeDomainData(waveform);
    let energy=0, count=0, rms=0;
    const hz=context.sampleRate/analyser.fftSize;
    for(let i=1;i<frequencies.length;i++) {
      if(i*hz>190) break;
      energy+=frequencies[i]/255; count++;
    }
    for(let i=0;i<waveform.length;i++) rms+=waveform[i]*waveform[i];
    audioRms=Math.sqrt(rms/waveform.length);
    const bass=energy/Math.max(count,1);
    return bass;
  }

  function tick(now) {
    const dt=Math.min((now-lastTime)/1000,.032); lastTime=now;
    let time=lastClock;
    if(playing) {
      time=audibleTime(); lastClock=time;
      const bass=audioLevels();
      if(customTrack) {
        bassAverage+= (bass-bassAverage)*Math.min(1,dt*2.2);
        const rising=bass-bassLevel;
        if(audioRms>.012 && bass>.28 && bass>Math.max(.31,bassAverage*1.13) && rising>.016 && time-lastOnset>.28) {
          impulse(clamp((bass-.15)*1.4,.4,1.2),time);
        }
      } else {
        while(time>=nextBeat*beatLength) {
          const beat=nextBeat++;
          impulse(beat%2===0?1:.7,beat*beatLength);
        }
      }
      bassLevel=bass;
      glow=Math.max(glow,clamp(audioRms*3.5)*.75);
    }
    for(const hit of pendingShoulder) if(hit.time<=time && !hit.done) {
      shoulderVelocity+=26*hit.strength; hit.done=true;
    }
    pendingShoulder=pendingShoulder.filter(hit=>!hit.done);
    ripples=ripples.filter(pulse=>time-pulse.time<.68);
    if(!playing) { ripples=[]; glow*=Math.exp(-dt*12); }
    else glow*=Math.exp(-dt*7);

    // Mass 1 / stiffness 100 / damping 10: a fast chin dip with relaxed recoil.
    // A small, slower lean keeps the character from feeling like a metronome.
    const lean=playing && !reduced.matches
      ? Math.sin(time/beatLength*TAU/8)*1.05*Math.min(1,audioRms*20) : 0;
    const target=reduced.matches?0:lean;
    const substeps=3, h=dt/substeps;
    for(let i=0;i<substeps;i++) {
      angularVelocity+=(-100*(angle-target)-10*angularVelocity)*h;
      angle+=angularVelocity*h;
      shoulderVelocity+=(-100*shoulder-10*shoulderVelocity)*h;
      shoulder+=shoulderVelocity*h;
    }
    if(reduced.matches) { angle=0; shoulder=0; angularVelocity=0; shoulderVelocity=0; ripples=[]; }
    if(playing || Math.abs(angle)+Math.abs(shoulder)+glow>.005 || lastDrawn<0) {
      draw(time); lastDrawn=now;
    } else if(lastDrawn!==0) {
      angle=0; shoulder=0; glow=0; draw(time); lastDrawn=0;
    }
    root.dataset.phase=playing?'listening':'idle';
    canvas.dataset.audioState=context?context.state:'not-started';
    canvas.dataset.audioTime=time.toFixed(3);
    canvas.dataset.nod=angle.toFixed(2);
    canvas.dataset.level=audioRms.toFixed(3);
    canvas.dataset.reducedMotion=String(reduced.matches);
    frameId=requestAnimationFrame(tick);
  }

  playButton.addEventListener('click',()=>playing?pause():start());
  trackButton.addEventListener('click',()=>fileInput.click());
  fileInput.addEventListener('change',async()=>{
    const file=fileInput.files[0];
    if(!file) return;
    pause();
    playButton.disabled=true; trackButton.disabled=true; busy=true;
    caption.textContent='Loading audio…';
    try {
      if(!context) createAudio();
      const decoded=await context.decodeAudioData(await file.arrayBuffer());
      buffer=decoded; customTrack=true; pausedAt=0; lastClock=0; lastOnset=-1;
      audioName=file.name;
      caption.textContent=audioName;
      playButton.textContent='Play track';
    } catch(error) {
      caption.textContent='This audio format could not be opened. Try MP3 or WAV.';
    } finally {
      busy=false; playButton.disabled=false; trackButton.disabled=false;
      fileInput.value='';
    }
  });
  document.addEventListener('visibilitychange',()=> { if(document.hidden) pause(); });
  window.addEventListener('pagehide',()=> {
    pause(); cancelAnimationFrame(frameId); observer.disconnect();
    if(context) context.close();
  },{once:true});
  const observer=new ResizeObserver(resize);
  observer.observe(canvas);
  resize();
  reference.style.visibility='hidden';
  frameId=requestAnimationFrame(tick);

  if(globalThis.Tweak) {
    const tweak=new Tweak({container:root,onChange:()=>draw(lastClock)});
    tweak.addSlider(settings,'depth',{label:'Head nod',min:.45,max:1.65,step:.05});
    tweak.addSlider(settings,'shoulder',{label:'Shoulder follow',min:0,max:2,step:.1});
  }
})();
</script>
</body></html>
