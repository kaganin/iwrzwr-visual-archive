<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Branch Choir · iwrzwr</title><style>:root{color-scheme:dark;--background:#000;--foreground:#eee;--muted-foreground:#999}*{box-sizing:border-box}body{margin:0;padding:24px;background:#000;color:#eee;font:16px/1.5 Arial,Helvetica,sans-serif}button{font:inherit;cursor:pointer}.viz-controls{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:24px}.btn{color:#bbb;background:#141414;border:1px solid #333;border-radius:6px;min-height:44px;padding:9px 14px;text-align:left}.btn[aria-pressed=true]{color:#fff;border-color:#ddd;background:#262626}.btn-block{width:100%}.text-small{font-size:14px}.text-muted{color:#999}:focus-visible{outline:2px solid #fff;outline-offset:3px}[hidden]{display:none!important}h3{font-size:18px;font-weight:500}figcaption{font-size:16px}canvas{max-width:100%}@media(max-width:520px){body{padding:16px}}</style><link rel="stylesheet" href="../typography.css"><script src="../motion-runtime.js"></script></head><body><div id="branch-choir" aria-label="Branch Solo playback study">
  <div class="bc-controls">
    <button type="button" data-replay>Replay</button>
    <button type="button" data-end>End sound</button>
    <button type="button" data-pause>Pause</button>
    <span class="bc-status" aria-live="polite">Playing · silent demo</span>
  </div>
  <figure>
    <svg class="bc-scene" viewBox="0 0 400 400" role="img" aria-label="One large songbird sings on a single branch, then flies away as the branch retracts to the left">
      <defs>
        <clipPath id="bc-disc-clip"><circle cx="200" cy="200" r="198.8"/></clipPath>
        <clipPath id="bc-branch-retract"><rect data-branch-mask x="-10" y="0" width="420" height="400"/></clipPath>
      </defs>
      <circle cx="200" cy="200" r="199" fill="#000" stroke="#ffffff29" stroke-width="1"/>
      <g clip-path="url(#bc-disc-clip)" stroke-linecap="round" stroke-linejoin="round">
        <g data-branches fill="none" clip-path="url(#bc-branch-retract)">
          <path d="M-12 287 C67 281 150 272 207 270 C265 268 310 242 338 213"/>
          <path d="M333 220 C330 202 340 180 350 177 C359 190 342 212 333 220 C351 213 368 197 370 187 C358 188 341 206 333 220"/>
        </g>
        <g data-birds></g>
      </g>
    </svg>
    <figcaption>Branch Solo</figcaption>
  </figure>
</div>
<style>
#branch-choir{font-family:system-ui,sans-serif;color:light-dark(#242424,#efefed)}
#branch-choir .bc-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:24px}
#branch-choir button{font:inherit;cursor:pointer;min-height:44px;padding:8px 13px;border:1px solid light-dark(#b7b7b3,#51514e);border-radius:8px;background:transparent;color:inherit}
#branch-choir button:disabled{opacity:.4;cursor:default}
#branch-choir .bc-status{font-size:12px;color:light-dark(#5d5d5a,#aaa9a3);margin-left:4px}
#branch-choir figure{margin:0;text-align:center}
#branch-choir .bc-scene{display:block;width:100%;max-width:440px;aspect-ratio:1;margin:auto}
#branch-choir figcaption{font-weight:500;margin-top:14px}
</style>
<script>
(()=>{
'use strict';
const root=document.getElementById('branch-choir');
const NS='http://www.w3.org/2000/svg',TAU=Math.PI*2;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
const settings={palette:'Amber + cyan',weight:1.25,energy:1};
const palettes={
 'Amber + cyan':{birds:['#FF0000'],branch:'#80766a',sound:'#91d6d8'},
 'Instrument':{birds:['#ff718a','#81a5ef','#79d6b9'],branch:'#666779',sound:'#efe7dc'},
 'White + red':{birds:['#e5e5df','#e5e5df','#e5e5df'],branch:'#747471',sound:'#ff3b30'}
};
const configs=[
 {x:207,y:270,s:1.55,flip:-1,phase:0,dx:360,dy:-260,roll:-20,delay:0}
];
const body='M-41-78 C-38-94-22-104-7-99 C4-96 11-84 20-72 C37-50 51-37 61-25 Q63-23 59-22 C37-12 8-8-12-14 C-36-23-44-36-43-58 C-42-68-38-72-41-78 Z';
const foldedWing='M-12-78 C-29-80-28-51-17-33 C-4-14 31-13 56-23 C32-37 13-58-1-72 C-4-76-8-79-12-78';
const flightWing='M-7-45 C-29-66-48-105-43-127 C-40-135-31-116-21-103 C-2-81 19-63 34-49 C16-42 1-42-7-45 Z';
const tails=[
 'M27-26 C48-2 54 24 71 43 Q78 51 75 39 C62 13 50-10 40-24'
];
const legs='M4-15 Q0-8 0-1 Q-4-3-7 1 M10-14 Q13-5 16-1 Q21-3 24 2';
const birds=configs.map((config,i)=>{
 const g=document.createElementNS(NS,'g');g.setAttribute('data-bird',String(i));
 g.innerHTML='<g data-pose><g data-mirror><g data-tail></g><g data-farwing></g><path data-body fill="#000"/><g data-wing></g><g data-head></g><g data-feet></g><g data-song></g></g></g>';
 root.querySelector('[data-birds]').append(g);
 const layers={};g.querySelectorAll('*').forEach(el=>{for(const key of Object.keys(el.dataset))layers[key]=el});
 return {g,layers,config,amplitude:.25};
});
const branches=root.querySelector('[data-branches]');
const branchMask=root.querySelector('[data-branch-mask]');
let state='playing',paused=reduced.matches,time=.65,elapsed=0,exitTime=0,last=0,raf=0,visible=true,reveal=1;
const length=10,flightDuration=1.18;
const clamp=(n,min=0,max=1)=>Math.max(min,Math.min(max,n));
const f=n=>Number(n).toFixed(3),fract=n=>n-Math.floor(n);
const path=(d,c,width=settings.weight,alpha=1,fill='none')=>`<path d="${d}" stroke="${c}" stroke-width="${f(width)}" fill="${fill}" opacity="${f(clamp(alpha))}"/>`;
function signal(t,voiceIndex){
 const cycle=(t+voiceIndex*.19)%2.45;
 const beats=[[.16,.08,.9],[.51,.11,.45],[.94,.16,.85],[1.31,.08,.42],[1.82,.13,.72]];
 let value=.03;for(const [at,width,amp] of beats)value+=amp*Math.exp(-Math.pow((cycle-at)/width,2)*.5);
 return clamp(value*(.65+.35*Math.sin(t*1.8+voiceIndex*2.1)**2));
}
function flightTransform(config,q){
 const x=config.x+config.dx*q;
 const y=config.y+config.dy*q-42*Math.sin(q*Math.PI);
 return {x,y,angle:config.roll*Math.sin(Math.min(1,q*2)*Math.PI*.5)};
}
function draw(){
 const palette=palettes[settings.palette],isExit=state==='departing';
 let branchAlpha=state==='idle'?0:1;
 if(isExit&&reduced.matches)branchAlpha=1-clamp(exitTime/.2);
 // Keep the branch opaque; erase it from its right-hand tip toward its left-hand root.
 const retract=isExit&&!reduced.matches?clamp((exitTime-.1)/.9):0;
 branchMask.setAttribute('transform',`translate(${f(-420*retract)} 0)`);
 branches.setAttribute('stroke',palette.branch);branches.setAttribute('stroke-width',settings.weight*.83);branches.setAttribute('opacity',branchAlpha*reveal);
 birds.forEach((bird,i)=>{
  const {config,layers}=bird;
  let flight=0,localTime=0,opacity=state==='idle'?0:reveal;
  if(isExit){
   localTime=Math.max(0,exitTime-config.delay);
   const u=clamp(localTime/flightDuration);
   flight=u;
   if(reduced.matches){flight=0;opacity=1-clamp(localTime/.2)}
  }
  const moving=isExit&&!reduced.matches&&localTime>0;
  const a=bird.amplitude*settings.energy*(state==='playing'?1:Math.max(0,1-exitTime/.12));
  const bob=reduced.matches?0:(Math.sin(time*TAU*.73+config.phase)*.75+a*.65);
  const tilt=reduced.matches?0:Math.sin(time*TAU*.38+config.phase)*1.2+a*1.2;
  const pos=flightTransform(config,flight);
  bird.g.setAttribute('opacity',opacity);bird.g.setAttribute('transform',`translate(${f(pos.x)} ${f(pos.y)}) rotate(${f(pos.angle)}) scale(${config.s})`);
  layers.pose.setAttribute('transform',moving?'translate(0 0)':`translate(0 ${f(-bob*.25)}) rotate(${f(tilt)} 0 0)`);
  layers.mirror.setAttribute('transform',`scale(${config.flip} 1)`);
  const color=palette.birds[i];
  layers.tail.innerHTML=path(tails[i],color,settings.weight);
  layers.tail.setAttribute('transform',`rotate(${f(moving?Math.sin(localTime*TAU*5)*3:Math.sin(time*1.7+config.phase)*1.5)} 28 -24)`);
  layers.body.setAttribute('d',body);layers.body.setAttribute('stroke',color);layers.body.setAttribute('stroke-width',settings.weight);
  const flyingMix=moving?clamp(flight*12):0;
  // Flight wings pivot at the shoulder. The body, head and tail retain their silhouette.
  const flap=Math.sin(localTime*TAU*5.8+i*.7),angle=-12+flap*53;
  layers.farwing.innerHTML=moving?path(flightWing,color,settings.weight,.48*flyingMix,'#000'):'';
  layers.farwing.setAttribute('transform',`rotate(${f(-angle*.55-22)} -7 -45) scale(.9 1)`);
  layers.wing.innerHTML=path(foldedWing,color,settings.weight,1-flyingMix)+`<g transform="rotate(${f(angle)} -7 -45)">${path(flightWing,color,settings.weight,flyingMix,'#000')}</g>`;
  layers.wing.setAttribute('transform',moving?'':`rotate(${f((reduced.matches?0:a*1.5))} -12 -65)`);
  const beakGap=state==='playing'?a*9:0;
  const blink=reduced.matches?0:Math.exp(-Math.pow((fract((time+i*1.3)/5.4)*5.4-4.9)/.08,2));
  layers.head.innerHTML=path('M-41-81 Q-47-84-54-82 L-41-76',color,settings.weight)+path(`M-54 ${f(-82+beakGap)}L-41-76`,color,settings.weight)+`<ellipse cx="-27" cy="-85" rx="2.1" ry="${f(Math.max(.4,2*(1-blink)))}" fill="${color}"/>`;
  layers.feet.innerHTML=path(legs,color,settings.weight,1-flyingMix*.8);
  layers.feet.setAttribute('transform',moving?'rotate(-35 6 -14)':'');
  let notes='';
  if(state==='playing')for(let j=0;j<4;j++){
   const p=fract(time*.52-j/4),x=-61-p*43;
   const pulse=signal(time-p*.8,0)*settings.energy;
   const height=3+p*(9+clamp(pulse)*10);
   const alpha=(1-p)*(.42+clamp(pulse)*.58)*Math.min(1,p*12);
   notes+=path(`M${f(x)} ${f(-78-height)}Q${f(x-5-p*4)} -78 ${f(x)} ${f(-78+height)}`,palette.sound,settings.weight,alpha);
  }
  layers.song.innerHTML=notes;
 });
}
function updateControls(){
 const busy=state==='departing',idle=state==='idle';
 root.querySelector('[data-replay]').disabled=busy;
 root.querySelector('[data-end]').disabled=state!=='playing';
 const pause=root.querySelector('[data-pause]');pause.disabled=idle;pause.textContent=paused?'Resume':'Pause';
 root.querySelector('.bc-status').textContent=idle?'Sound ended':paused?'Paused · silent demo':state==='departing'?'Flying away':'Playing · silent demo';
 root.querySelector('.bc-scene').setAttribute('aria-label',idle?'Playback ended. The circle is completely black.':'One large songbird on a single branch. '+(state==='departing'?'The bird flies away while the branch retracts to the left.':'Visible cyan sound waves. Silent simulated playback.'));
}
function end(){if(state!=='playing')return;state='departing';exitTime=0;paused=false;last=0;updateControls();schedule()}
function replay(){
 if(state==='departing')return;
 reveal=state==='idle'?0:1;state='playing';elapsed=0;exitTime=0;paused=false;last=0;updateControls();draw();schedule();
}
function schedule(){if(!raf&&!paused&&visible&&!document.hidden&&state!=='idle')raf=requestAnimationFrame(frame)}
function frame(now){
 raf=0;const dt=last?Math.min(.05,(now-last)/1000):0;last=now;time+=dt;reveal=clamp(reveal+dt/.18);
 if(state==='playing'){
  elapsed+=dt;
  birds.forEach((bird,i)=>{const target=signal(time,i);bird.amplitude+=(target-bird.amplitude)*(1-Math.exp(-dt/(target>bird.amplitude?.04:.17)))});
  if(elapsed>=length)end();
 }else if(state==='departing'){
  exitTime+=dt;
  if(exitTime>=(reduced.matches?.4:flightDuration+.2)){
   state='idle';elapsed=0;exitTime=0;updateControls();
  }
 }
 draw();schedule();
}
root.querySelector('[data-replay]').addEventListener('click',replay);
root.querySelector('[data-end]').addEventListener('click',end);
root.querySelector('[data-pause]').addEventListener('click',()=>{paused=!paused;last=0;if(paused){cancelAnimationFrame(raf);raf=0}updateControls();schedule()});
document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden){cancelAnimationFrame(raf);raf=0}else schedule()});
new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;if(!visible){cancelAnimationFrame(raf);raf=0;last=0}else schedule()}).observe(root);
reduced.addEventListener('change',()=>{if(reduced.matches){paused=true;cancelAnimationFrame(raf);raf=0;last=0;draw();updateControls()}});
draw();updateControls();schedule();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:draw});tweak.addSelect(settings,'palette',{label:'Palette',options:['Amber + cyan','Instrument','White + red']});tweak.addSlider(settings,'weight',{label:'Line weight',min:1,max:2.4,step:.1});tweak.addSlider(settings,'energy',{label:'Music response',min:.3,max:1.3,step:.1})}
})();
</script>
</body></html>
